# =============================================================================
# GPU 覆盖文件（整条流水线）
#
# 只在宿主机有 NVIDIA 驱动 + nvidia-container-toolkit 时使用。
#
# 用法（两种写法等价，任选其一）：
#   docker compose -f docker-compose.gpu.yml up -d --build
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d --build
#
# 说明：本文件通过 include 引入了 docker-compose.yml（需要 Compose v2.20+），
#       因此可以单独 -f 使用；不会再报
#       "service ... has neither an image nor a build context specified"。
#
# 验证宿主机 GPU 可用：
#   docker run --rm --gpus all nvidia/cuda:12.6.1-runtime-ubuntu22.04 nvidia-smi
#
# 三个模型服务都会自动探测 GPU（DEVICE=auto），容器看得到显卡就会用 gpu:0，
# 看不到就回退 CPU，不会启动失败。
#
# ★ 构建参数：本文件给三个服务强制使用 GPU 版构建参数（CUDA 版 torch /
#   paddlepaddle-gpu cu126），即使 .env 里还留着示例的 CPU 默认值
#   （TORCH_INDEX_URL=.../cpu、PADDLE_VARIANT=cpu、SLANET_PADDLE_VARIANT=cpu），
#   也不会误构建成 CPU 镜像。需要微调时可设置：
#     DETECTION_TORCH_INDEX_URL、FORMULA_PADDLE_BASE_IMAGE / FORMULA_PADDLE_VARIANT、
#     TABLE_PADDLE_BASE_IMAGE / TABLE_PADDLE_VARIANT（例如让 SLANet 回 CPU）
#
# 多卡机器上想固定某张卡，给对应服务加 CUDA_VISIBLE_DEVICES: "0"。

include:
  - docker-compose.yml

services:
  yolov13-formula-detection:
    build:
      args:
        # GPU 模式必须用 CUDA 版 torch（与 TORCH_VERSION=2.4.0 匹配）
        TORCH_INDEX_URL: ${DETECTION_TORCH_INDEX_URL:-https://download.pytorch.org/whl/cu121}
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      DEVICE: ${DETECTION_DEVICE:-0}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  pp-formulanet-plus-l:
    build:
      args:
        BASE_IMAGE: ${FORMULA_PADDLE_BASE_IMAGE:-nvidia/cuda:12.6.1-runtime-ubuntu22.04}
        PADDLE_VARIANT: ${FORMULA_PADDLE_VARIANT:-gpu}
    environment:
      NVIDIA_VISIBLE_DEVICES: all
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  slanet-plus:
    build:
      args:
        # 想在 GPU 模式下让表格识别继续用 CPU：TABLE_PADDLE_VARIANT=cpu + TABLE_PADDLE_BASE_IMAGE=ubuntu:22.04
        BASE_IMAGE: ${TABLE_PADDLE_BASE_IMAGE:-nvidia/cuda:12.6.1-runtime-ubuntu22.04}
        PADDLE_VARIANT: ${TABLE_PADDLE_VARIANT:-gpu}
    environment:
      NVIDIA_VISIBLE_DEVICES: all
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
