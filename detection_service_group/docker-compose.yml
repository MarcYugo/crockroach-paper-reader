# =============================================================================
# 公式 / 表格识别流水线 —— 一键部署（CPU 也能跑）
#
# 四个服务在同一个 compose 网络里，router service 直接用服务名访问下游：
#
#   client ──▶ router-service:9003
#                 ├─ 生产者：yolov13-formula-detection:9000   （检测：公式/表格/图片）
#                 ├─ 消费者：pp-formulanet-plus-l:9001        （公式 → LaTeX）
#                 └─ 消费者：slanet-plus:9002                 （表格 → HTML）
#
# 本文件默认【不含 GPU 直通】，任何机器都能起（模型会自动回退 CPU）。
# 有 NVIDIA GPU 时使用 GPU 覆盖文件（它已 include 本文件，两种写法等价）：
#   docker compose -f docker-compose.gpu.yml up -d --build
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d --build
#
# 前置条件（三个模型目录，缺一不可，否则对应容器会加载失败）：
#   1) yolov13_formula_detection_service/models/yolov13_arxivformula_sft/yolov13s_ep5_bs32_lr_0.01.pt
#   2) pp-formulanet-plus-l/models/PP-FormulaNet_plus-L/        公式模型（约 700MB）
#        bash pp-formulanet-plus-l/scripts/download_model.sh
#   3) slanet_plus_service/models/SLANet_plus/                  表格模型
#        cd slanet_plus_service && bash download.sh
#   说明：模型走 volume 只读挂载、不进镜像；目录不存在时 Docker 会自动建空目录，
#         容器随后会因找不到模型而报错，所以务必先准备好。
#
# 用法：
#   cp .env.example .env
#   docker compose up -d --build
#   docker compose logs -f router-service
#   curl http://127.0.0.1:9003/v1/info
#
# 只想单独部署 router service（下游已在别处跑）：用 router_service/docker-compose.yaml

services:
  # --------------------------------------------------------------------------
  # 生产者：YOLOv13 公式检测
  # --------------------------------------------------------------------------
  yolov13-formula-detection:
    build:
      context: ./yolov13_formula_detection_service
      dockerfile: Dockerfile
      args:
        TORCH_INDEX_URL: ${TORCH_INDEX_URL:-https://download.pytorch.org/whl/cpu}
        TORCH_VERSION: "2.4.0"
        TORCHVISION_VERSION: "0.19.0"
        INSTALL_FLASH_ATTN: ${INSTALL_FLASH_ATTN:-0}
    image: yolov13-formula-detection:latest
    restart: unless-stopped
    ports:
      - "${DETECTION_PORT:-9000}:9000"
    environment:
      MODEL_PATH: ${MODEL_PATH:-/app/yolov13_formula_detection_service/models/yolov13_arxivformula_sft/yolov13s_ep5_bs32_lr_0.01.pt}
      DEVICE: ${DETECTION_DEVICE:-}          # ""=自动；"0"=第一块 GPU；"cpu"=仅 CPU
      IMGSZ: ${DETECT_IMGSZ:-640}
      CONF: ${DETECT_CONF:-0.25}
      IOU: ${DETECT_IOU:-0.7}
      MAX_DET: ${DETECT_MAX_DET:-300}
      BATCH: ${DETECT_BATCH:-8}
      DEDUP: ${DETECT_DEDUP:-true}
      DEDUP_THR: ${DETECT_DEDUP_THR:-0.8}
      # router service 需要框内图像才能继续识别，这里必须返回 crop
      RETURN_CROPS: "true"
      CROP_FORMAT: ${DETECT_CROP_FORMAT:-png}
      CROP_QUALITY: ${DETECT_CROP_QUALITY:-90}
      CROP_PADDING: ${DETECT_CROP_PADDING:-0}
      WARMUP: "true"
      MAX_IMAGES: ${DETECT_MAX_IMAGES:-50}
      MAX_PIXELS: ${DETECT_MAX_PIXELS:-40000000}
      MAX_UPLOAD_MB: ${DETECT_MAX_UPLOAD_MB:-30}
      SERVICE_PORT: "9000"
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      # appuser (UID 1000) 需要宿主机目录可遍历、权重文件可读；参见服务 README 的权限修复说明。
      - ./yolov13_formula_detection_service/models/:/app/yolov13_formula_detection_service/models/:ro
    shm_size: "2gb"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 300s
    deploy:
      resources:
        limits:
          memory: ${DETECTION_MEMORY:-12g}
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  # --------------------------------------------------------------------------
  # 消费者 1：PP-FormulaNet_plus-L 公式识别
  # --------------------------------------------------------------------------
  pp-formulanet-plus-l:
    build:
      context: ./pp-formulanet-plus-l
      dockerfile: Dockerfile
      args:
        PADDLEOCR_VERSION: "3.0.3"
        BASE_IMAGE: ${PADDLE_BASE_IMAGE:-nvidia/cuda:12.6.1-runtime-ubuntu22.04}
        PADDLE_VARIANT: ${PADDLE_VARIANT:-gpu}
        PIP_INDEX: ${PIP_INDEX:-https://pypi.org/simple}
    image: pp-formulanet-plus-l:3.0.0
    restart: unless-stopped
    # 模型目录由宿主机 root 所有且权限为 700，容器内 appuser 无法遍历读取。
    user: "0:0"
    ipc: host
    ports:
      - "${FORMULA_PORT:-9001}:9001"
    environment:
      MODEL_NAME: PP-FormulaNet_plus-L
      MODEL_DIR: /models/PP-FormulaNet_plus-L
      DEVICE: ${FORMULA_DEVICE:-auto}
      DEVICE_STRICT: "false"
      PREDICTOR_POOL_SIZE: ${FORMULA_PREDICTOR_POOL_SIZE:-}
      CPU_THREADS: ${FORMULA_CPU_THREADS:-}
      ENABLE_MKLDNN: ${FORMULA_ENABLE_MKLDNN:-true}
      USE_TENSORRT: "false"
      PRECISION: fp32
      WARMUP: "true"
      MAX_QUEUE: ${FORMULA_MAX_QUEUE:-64}
      QUEUE_TIMEOUT: ${FORMULA_QUEUE_TIMEOUT:-30}
      DEFAULT_BATCH_SIZE: "1"
      MAX_BATCH_SIZE: ${FORMULA_MAX_BATCH_SIZE:-8}
      WEB_CONCURRENCY: "1"
      PORT: "9001"
      MAX_IMAGE_MB: ${FORMULA_MAX_IMAGE_MB:-20}
      TEMP_DIR: /dev/shm/pp-formulanet
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./pp-formulanet-plus-l/models/PP-FormulaNet_plus-L:/models/PP-FormulaNet_plus-L:ro
    shm_size: "2gb"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9001/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 900s
    deploy:
      resources:
        limits:
          memory: ${FORMULA_MEMORY:-16g}
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  # --------------------------------------------------------------------------
  # 消费者 2：SLANet_plus 表格结构识别
  # --------------------------------------------------------------------------
  slanet-plus:
    build:
      context: ./slanet_plus_service
      dockerfile: Dockerfile
      args:
        PADDLEOCR_VERSION: "3.0.3"
        BASE_IMAGE: ${PADDLE_BASE_IMAGE:-ubuntu:22.04}
        PADDLE_VARIANT: ${SLANET_PADDLE_VARIANT:-cpu}
        PIP_INDEX: ${PIP_INDEX:-https://pypi.org/simple}
    image: slanet-plus:3.0.0
    restart: unless-stopped
    # 模型目录由宿主机 root 所有且权限为 700，容器内 appuser 无法遍历读取。
    user: "0:0"
    ipc: host
    ports:
      - "${TABLE_PORT:-9002}:9002"
    environment:
      MODEL_NAME: SLANet_plus
      MODEL_DIR: /models/SLANet_plus
      DEVICE: ${TABLE_DEVICE:-auto}
      DEVICE_STRICT: "false"
      PREDICTOR_POOL_SIZE: ${TABLE_PREDICTOR_POOL_SIZE:-}
      CPU_THREADS: ${TABLE_CPU_THREADS:-}
      ENABLE_MKLDNN: ${TABLE_ENABLE_MKLDNN:-true}
      USE_TENSORRT: "false"
      PRECISION: fp32
      WARMUP: "true"
      MAX_QUEUE: ${TABLE_MAX_QUEUE:-64}
      QUEUE_TIMEOUT: ${TABLE_QUEUE_TIMEOUT:-30}
      DEFAULT_BATCH_SIZE: "1"
      MAX_BATCH_SIZE: ${TABLE_MAX_BATCH_SIZE:-8}
      WEB_CONCURRENCY: "1"
      PORT: "9002"
      MAX_IMAGE_MB: ${TABLE_MAX_IMAGE_MB:-20}
      TEMP_DIR: /dev/shm/slanet-plus
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./slanet_plus_service/models/SLANet_plus:/models/SLANet_plus:ro
    shm_size: "1gb"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9002/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 300s
    deploy:
      resources:
        limits:
          memory: ${TABLE_MEMORY:-8g}
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  # --------------------------------------------------------------------------
  # 路由 + 缓冲池：把上面三个串成流水线
  # --------------------------------------------------------------------------
  router-service:
    build:
      context: ./router_service
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: ${ROUTER_BASE_IMAGE:-python:3.11-slim-bookworm}
        PIP_INDEX: ${PIP_INDEX:-https://pypi.org/simple}
    image: router-service:1.0.0
    restart: unless-stopped
    ports:
      - "${ROUTER_PORT:-9003}:9003"
    environment:
      SERVICE_PORT: "9003"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

      # 同一 compose 网络内直接按服务名解析
      DETECTION_URL: http://yolov13-formula-detection:9000
      FORMULA_URL: http://pp-formulanet-plus-l:9001
      TABLE_URL: http://slanet-plus:9002

      MAX_CONCURRENT_REQUESTS: ${MAX_CONCURRENT_REQUESTS:-2}
      MAX_QUEUE: ${MAX_QUEUE:-64}
      QUEUE_TIMEOUT: ${QUEUE_TIMEOUT:-30}
      REQUEST_TIMEOUT: ${REQUEST_TIMEOUT:-300}
      SESSION_TTL: ${SESSION_TTL:-1800}

      FORMULA_WORKERS: ${FORMULA_WORKERS:-2}
      TABLE_WORKERS: ${TABLE_WORKERS:-1}
      FORMULA_BATCH_SIZE: ${FORMULA_BATCH_SIZE:-4}
      # SLANet/PaddleX 当前批量预测可能返回 bbox 数量不匹配；逐图识别更稳定。
      TABLE_BATCH_SIZE: ${TABLE_BATCH_SIZE:-1}
      BATCH_WINDOW_MS: ${BATCH_WINDOW_MS:-20}
      POOL_MAX_SIZE: ${POOL_MAX_SIZE:-512}
      POOL_OVERFLOW: ${POOL_OVERFLOW:-block}

      HTTP_CONNECT_TIMEOUT: ${HTTP_CONNECT_TIMEOUT:-10}
      # 公式识别第一次调用含预热，读超时给足
      HTTP_READ_TIMEOUT: ${HTTP_READ_TIMEOUT:-300}
      HTTP_MAX_CONNECTIONS: ${HTTP_MAX_CONNECTIONS:-32}

      FORCE_RETURN_CROPS: "true"
      # 请与上面 yolov13-formula-detection 的 CONF/IMGSZ 等保持一致（同一个 .env 驱动）
      DETECT_CONF: ${DETECT_CONF:-0.25}
      DETECT_IOU: ${DETECT_IOU:-0.7}
      DETECT_IMGSZ: ${DETECT_IMGSZ:-640}
      DETECT_MAX_DET: ${DETECT_MAX_DET:-300}
      DETECT_BATCH: ${DETECT_BATCH:-8}
      DETECT_DEDUP: ${DETECT_DEDUP:-true}
      DETECT_DEDUP_THR: ${DETECT_DEDUP_THR:-0.8}
      DETECT_CROP_FORMAT: ${DETECT_CROP_FORMAT:-png}
      DETECT_CROP_QUALITY: ${DETECT_CROP_QUALITY:-90}
      DETECT_CROP_PADDING: ${DETECT_CROP_PADDING:-0}
      FORMULA_CLASSES: ${FORMULA_CLASSES:-InlineFormula,DisplayedFormulaLine,FormulaNumber,DisplayedFormulaBlock}
      TABLE_CLASSES: ${TABLE_CLASSES:-Table}
      FIGURE_CLASSES: ${FIGURE_CLASSES:-Figure}
    depends_on:
      # 三个模型服务加载要几分钟，这里只等服务“启动”，不阻塞路由进程；
      # 模型没就绪时 /v1/router/predict 会返回 502，/ready 会返回 503。
      yolov13-formula-detection:
        condition: service_started
      pp-formulanet-plus-l:
        condition: service_started
      slanet-plus:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9003/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: ${ROUTER_MEMORY:-2g}
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
