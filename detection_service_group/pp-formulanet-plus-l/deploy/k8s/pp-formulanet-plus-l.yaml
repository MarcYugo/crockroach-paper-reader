# PP-FormulaNet_plus-L 公式识别服务 —— Kubernetes 部署清单
#
# 包含：Namespace / Deployment / Service / HPA
# 特点：
#   * 模型通过 hostPath 从宿主机挂载（单机/固定节点场景最简单）
#     若要用 PVC（多节点共享），见文件底部注释。
#   * 用 startupProbe 覆盖模型加载期（最长 15 分钟），就绪前不接流量。
#   * 并发策略：每 Pod 1 张 GPU + 进程内 predictor 池；副本数由 HPA / 手写控制。
#
# 应用：kubectl apply -f deploy/k8s/pp-formulanet-plus-l.yaml
---
apiVersion: v1
kind: Namespace
metadata:
  name: formula-ocr
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pp-formulanet-plus-l
  namespace: formula-ocr
  labels:
    app: pp-formulanet-plus-l
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0     # 模型加载慢，先起新的再停旧的，避免服务中断
      maxSurge: 1
  selector:
    matchLabels:
      app: pp-formulanet-plus-l
  template:
    metadata:
      labels:
        app: pp-formulanet-plus-l
    spec:
      # 只调度到挂了 GPU 的节点；按你的集群实际情况改标签
      nodeSelector:
        accelerator: nvidia-gpu
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      terminationGracePeriodSeconds: 60

      # 非 root 运行（镜像内 appuser uid=1000）
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000

      volumes:
        # ① 模型目录：宿主机路径，节点上必须先放好模型文件
        - name: model
          hostPath:
            path: /data/models/PP-FormulaNet_plus-L   # ★ 改成你的实际路径
            type: Directory
        # ② 共享内存（Paddle 推理需要）
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
        - name: tmp
          emptyDir: {}

      containers:
        - name: api
          image: pp-formulanet-plus-l:3.0.0
          # 本地构建的镜像建议固定 digest 或使用私有仓库地址，例如：
          # image: registry.example.com/ocr/pp-formulanet-plus-l:3.0.0
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 9001

          env:
            # ---------- 模型 ----------
            - name: MODEL_DIR
              value: "/models/PP-FormulaNet_plus-L"
            - name: DEVICE
              value: "gpu:0"              # 本 Pod 已申请 nvidia.com/gpu，固定用 GPU
            - name: DEVICE_STRICT
              value: "true"               # 检测不到 GPU 时直接失败，避免占着 GPU 跑 CPU
            - name: PREDICTOR_POOL_SIZE      # 并行推理路数
              value: "2"
            - name: CPU_THREADS
              value: "4"
            - name: USE_TENSORRT
              value: "false"
            - name: WARMUP
              value: "true"
            # ---------- 并发与限流 ----------
            - name: MAX_QUEUE
              value: "64"
            - name: QUEUE_TIMEOUT
              value: "30"
            - name: MAX_BATCH_SIZE
              value: "8"
            - name: WEB_CONCURRENCY          # GPU 场景保持 1
              value: "1"
            # ---------- 其它 ----------
            - name: PORT
              value: "9001"              # 与 containerPort / Service 保持一致
            - name: TEMP_DIR
              value: "/dev/shm/pp-formulanet"
            - name: LOG_LEVEL
              value: "INFO"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name

          volumeMounts:
            - name: model
              mountPath: /models/PP-FormulaNet_plus-L
              readOnly: true       # ★ 只读挂载，容器无法改动模型文件
            - name: dshm
              mountPath: /dev/shm
            - name: tmp
              mountPath: /tmp

          resources:
            requests:
              cpu: "4"
              memory: 8Gi
            limits:
              cpu: "8"
              memory: 16Gi
              nvidia.com/gpu: 1     # ★ 申请 1 张 GPU，稀缺资源，副本数受节点 GPU 总数限制

          # 启动探针：给模型加载留足时间（900s），失败才重启
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 90
            timeoutSeconds: 5

          # 就绪探针：模型真正加载完成后才开始接流量
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 6

          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 10"]   # 优雅摘流

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false          # 需要写 /tmp 与缓存
            capabilities:
              drop: ["ALL"]

---
apiVersion: v1
kind: Service
metadata:
  name: pp-formulanet-plus-l
  namespace: formula-ocr
  labels:
    app: pp-formulanet-plus-l
spec:
  type: ClusterIP
  selector:
    app: pp-formulanet-plus-l
  ports:
    - name: http
      port: 9001
      targetPort: http
  sessionAffinity: None
---
# 横向扩容：按 CPU 触发。注意每多 1 个副本就多占 1 张 GPU，
# maxReplicas 不要超过集群可用 GPU 数量，否则多余副本会一直 Pending。
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: pp-formulanet-plus-l
  namespace: formula-ocr
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: pp-formulanet-plus-l
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 600   # 模型加载慢，缩容要保守
      policies:
        - type: Pods
          value: 1
          periodSeconds: 300
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120

# ---------------------------------------------------------------------------
# 多节点共享模型（PVC）写法：把上面的 hostPath volume 换成
#   volumes:
#     - name: model
#       persistentVolumeClaim:
#         claimName: pp-formulanet-plus-l-model   # ReadOnlyMany / ReadWriteMany
# 并预先用 kubectl cp、initContainer 或 job 把模型文件上传到该 PVC。
# ---------------------------------------------------------------------------
