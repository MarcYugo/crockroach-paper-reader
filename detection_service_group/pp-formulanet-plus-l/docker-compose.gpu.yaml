# GPU 覆盖文件（PP-FormulaNet_plus-L）
#
# 只在宿主机有 NVIDIA 驱动 + nvidia-container-toolkit 时叠加：
#   docker compose -f docker-compose.yaml -f docker-compose.gpu.yaml up -d --build
# 或直接跑 ./docker-up.sh（自动探测 nvidia-smi 后决定是否叠加）。
#
# DEVICE 保持默认 auto 即可：容器能看到 GPU 时会自动选 gpu:0，
# 若仍然检测不到，应用会记录原因并回退到 CPU（不会启动失败）。
#
# 多卡机器上想固定某张卡，取消注释：
#   CUDA_VISIBLE_DEVICES: "0"

services:
  pp-formulanet-plus-l:
    environment:
      NVIDIA_VISIBLE_DEVICES: all
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
