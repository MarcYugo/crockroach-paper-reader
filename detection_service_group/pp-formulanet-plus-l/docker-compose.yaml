# PP-FormulaNet_plus-L 公式识别服务 —— docker compose 部署
#
# 设备策略：DEVICE 默认 auto，容器启动时自动探测：
#   * 有可用 GPU（已通过 nvidia-container-toolkit 挂载）→ gpu:0
#   * 无 GPU（纯 CPU 机器 / 没有 NVIDIA 驱动 / 未挂载 GPU）→ cpu
# 所以本文件【不含 GPU 直通配置】，任何机器都能直接 `docker compose up -d`。
#
# 模型目录以【只读】方式挂载进容器，容器重启/销毁都不会动到宿主机文件。
#
# 要用 GPU，叠加 GPU 覆盖文件（宿主需已装 NVIDIA 驱动 + nvidia-container-toolkit，
# 验证：docker run --rm --gpus all nvidia/cuda:12.6.1-runtime-ubuntu22.04 nvidia-smi）：
#   docker compose -f docker-compose.yaml -f docker-compose.gpu.yaml up -d --build
# 或直接跑 ./docker-up.sh，脚本会自动探测 nvidia-smi 后决定是否叠加。
#
# 纯 CPU 机器想构建更小的镜像（不带 CUDA 运行时）：
#   DOCKER_BASE_IMAGE=ubuntu:22.04 PADDLE_VARIANT=cpu docker compose build
#
# 用法：
#   1) 把本地下载好的模型放到 ./models/PP-FormulaNet_plus-L/（或在下面改成绝对路径）
#      目录内应包含：inference.json  inference.pdiparams  inference.yml  config.json
#   2) docker compose up -d --build
#   3) curl http://127.0.0.1:9001/health

services:
  model-permissions:
    image: pp-formulanet-plus-l:3.0.0
    user: "0:0"
    command: ["chmod", "-R", "a+rX", "--", "/models"]
    volumes:
      - ${LOCAL_MODEL_DIR:-./models/PP-FormulaNet_plus-L}:/models:rw
    restart: "no"

  pp-formulanet-plus-l:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PADDLEOCR_VERSION: "3.0.3"
        BASE_IMAGE: ${DOCKER_BASE_IMAGE:-nvidia/cuda:12.6.1-runtime-ubuntu22.04}
        # gpu=装 paddlepaddle-gpu（无 GPU 时自动降级跑 CPU）；cpu=装 paddlepaddle（镜像更小）
        PADDLE_VARIANT: ${PADDLE_VARIANT:-gpu}
        # 国内构建加速：
        # PIP_INDEX: https://pypi.tuna.tsinghua.edu.cn/simple
    image: pp-formulanet-plus-l:3.0.0
    restart: unless-stopped
    ipc: host
    depends_on:
      model-permissions:
        condition: service_completed_successfully

    ports:
      - "${SERVICE_PORT:-9001}:9001"

    environment:
      MODEL_NAME: ${MODEL_NAME:-PP-FormulaNet_plus-L}
      MODEL_DIR: ${MODEL_DIR:-/models/PP-FormulaNet_plus-L}
      # auto：自动检测 GPU，没有就用 CPU；也可写死 cpu / gpu:0 / gpu:0,1
      DEVICE: ${DEVICE:-auto}
      # true 时取消自动回退：DEVICE=gpu:0 但没检测到 GPU 会直接报错
      DEVICE_STRICT: ${DEVICE_STRICT:-false}
      # 留空 = 按设备自动（GPU:2，CPU:1~2）；显式设置则覆盖
      PREDICTOR_POOL_SIZE: ${PREDICTOR_POOL_SIZE:-}
      # 留空 = 按设备自动（CPU: 核数/池大小，GPU: 4）
      CPU_THREADS: ${CPU_THREADS:-}
      ENABLE_MKLDNN: ${ENABLE_MKLDNN:-true}
      USE_TENSORRT: ${USE_TENSORRT:-false}
      PRECISION: ${PRECISION:-fp32}
      WARMUP: ${WARMUP:-true}
      MAX_QUEUE: ${MAX_QUEUE:-64}
      QUEUE_TIMEOUT: ${QUEUE_TIMEOUT:-30}
      DEFAULT_BATCH_SIZE: ${DEFAULT_BATCH_SIZE:-1}
      MAX_BATCH_SIZE: ${MAX_BATCH_SIZE:-8}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-1}
      PORT: ${SERVICE_PORT:-9001}
      MAX_IMAGE_MB: ${MAX_IMAGE_MB:-20}
      TEMP_DIR: ${TEMP_DIR:-/dev/shm/pp-formulanet}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # GPU 可见性 / CUDA_VISIBLE_DEVICES 等放在 docker-compose.gpu.yaml 里；
      # 需要限定显卡时，自行在那边加 CUDA_VISIBLE_DEVICES=0

    volumes:
      - ${LOCAL_MODEL_DIR:-./models/PP-FormulaNet_plus-L}:${MODEL_DIR:-/models/PP-FormulaNet_plus-L}:ro
      - ./logs:/app/logs
      - ${LOCAL_TEMP_DIR:-/dev/shm}:/dev/shm

    # Paddle 推理会用到共享内存
    shm_size: "2gb"

    # 提高文件句柄上限
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

    # 资源限制：GPU 直通配置已移到 docker-compose.gpu.yaml，
    # 这样在没有 GPU 的机器上也能直接 docker compose up
    deploy:
      resources:
        limits:
          memory: 16g

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9001/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 900s   # 首次加载模型（含 TensorRT 编译）可能要十几分钟

    # 避免日志把磁盘写满
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

# ---------------------------------------------------------------------------
# CPU-only 部署（不需要 GPU 的机器 / 测试环境）
#   1) 不要叠加 docker-compose.gpu.yaml；
#   2) 想让镜像更小可加构建参数：DOCKER_BASE_IMAGE=ubuntu:22.04 PADDLE_VARIANT=cpu；
#   3) DEVICE 保持 auto 即可（也可显式写 cpu）。
# 应用层会自己检测 GPU：没 GPU 时自动用 CPU，不依赖本文件的 GPU 配置。
# ---------------------------------------------------------------------------
