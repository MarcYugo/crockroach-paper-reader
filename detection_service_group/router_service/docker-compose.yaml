# router_service —— 公式/表格识别流水线路由服务（单独部署）
#
# 适用场景：三个下游服务已经跑起来（裸 docker、K8s、或别的 compose），
# 只想把 router service 单独起一个容器。
#
# 下游地址用 .env 的 DETECTION_URL / FORMULA_URL / TABLE_URL 指定，
# 默认值与 app/config.py 里的代码默认值一致（127.0.0.1）。
#
# ⚠️ 注意：容器内的 127.0.0.1 是「容器自己」，不是宿主机！
#    下游跑在宿主机、而本服务跑在容器里时，必须用 .env 改成宿主机地址，否则连接被拒：
#      DETECTION_URL=http://host.docker.internal:9000   # Docker Desktop（Win/macOS）
#      FORMULA_URL=http://host.docker.internal:9001
#      TABLE_URL=http://host.docker.internal:9002
#    下游在别的机器上时，直接写那台机器的 IP，如 http://192.168.1.50:9000。
#    只有本服务以 network_mode: host 运行、或不走容器直接跑 app 时，127.0.0.1 才指向真正的本机服务。
#
# 下面已配好 extra_hosts（host.docker.internal → 宿主机网关）：Docker Desktop 自带该名字，
# Linux 需要它才能解析，改成上面的宿主地址后即可直接用。
#
# 用法：
#   cp .env.example .env
#   docker compose up -d --build
#   curl http://127.0.0.1:9003/health
#
# 想一次把四个服务都起来，用仓库根目录的 docker-compose.yml。

services:
  router-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: ${DOCKER_BASE_IMAGE:-python:3.11-slim-bookworm}
        # 国内构建加速：PIP_INDEX=https://pypi.tuna.tsinghua.edu.cn/simple
        PIP_INDEX: ${PIP_INDEX:-https://pypi.org/simple}
    image: router-service:1.0.0
    restart: unless-stopped

    ports:
      # 宿主端口:容器端口；容器内监听 SERVICE_PORT
      - "${ROUTER_PORT:-9003}:${SERVICE_PORT:-9003}"

    environment:
      SERVICE_HOST: 0.0.0.0
      SERVICE_PORT: ${SERVICE_PORT:-9003}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

      # ---- 下游三个服务 ----
      # 默认 127.0.0.1 = 容器自身；下游在宿主机时必须在 .env 里覆盖（见文件头说明）
      DETECTION_URL: ${DETECTION_URL:-http://127.0.0.1:9000}
      FORMULA_URL: ${FORMULA_URL:-http://127.0.0.1:9001}
      TABLE_URL: ${TABLE_URL:-http://127.0.0.1:9002}

      # ---- 请求准入：同时最多处理多少个请求，多出来的排队等待 ----
      MAX_CONCURRENT_REQUESTS: ${MAX_CONCURRENT_REQUESTS:-2}
      # 排队容量上限，排满后新请求直接 503
      MAX_QUEUE: ${MAX_QUEUE:-64}
      QUEUE_TIMEOUT: ${QUEUE_TIMEOUT:-30}
      REQUEST_TIMEOUT: ${REQUEST_TIMEOUT:-300}
      SESSION_TTL: ${SESSION_TTL:-1800}

      # ---- 缓冲池与消费者：公式/表格两条流水线并行 ----
      FORMULA_WORKERS: ${FORMULA_WORKERS:-2}
      TABLE_WORKERS: ${TABLE_WORKERS:-1}
      FORMULA_BATCH_SIZE: ${FORMULA_BATCH_SIZE:-4}
      # SLANet/PaddleX 当前批量预测可能返回 bbox 数量不匹配；逐图识别更稳定。
      TABLE_BATCH_SIZE: ${TABLE_BATCH_SIZE:-1}
      BATCH_WINDOW_MS: ${BATCH_WINDOW_MS:-20}
      POOL_MAX_SIZE: ${POOL_MAX_SIZE:-512}
      # block=池满时等空位（背压，不丢数据）；drop=池满直接判失败
      POOL_OVERFLOW: ${POOL_OVERFLOW:-block}

      # ---- HTTP 客户端 ----
      HTTP_CONNECT_TIMEOUT: ${HTTP_CONNECT_TIMEOUT:-10}
      HTTP_READ_TIMEOUT: ${HTTP_READ_TIMEOUT:-300}
      HTTP_MAX_CONNECTIONS: ${HTTP_MAX_CONNECTIONS:-32}

      # ---- 检测参数（请求可用 params 覆盖；return_crops 由服务强制开启）----
      FORCE_RETURN_CROPS: ${FORCE_RETURN_CROPS:-true}
      DETECT_CONF: ${DETECT_CONF:-0.25}
      DETECT_IOU: ${DETECT_IOU:-0.7}
      DETECT_IMGSZ: ${DETECT_IMGSZ:-640}
      DETECT_MAX_DET: ${DETECT_MAX_DET:-300}
      DETECT_BATCH: ${DETECT_BATCH:-8}
      DETECT_DEDUP: ${DETECT_DEDUP:-true}
      DETECT_DEDUP_THR: ${DETECT_DEDUP_THR:-0.8}
      DETECT_CROP_FORMAT: ${DETECT_CROP_FORMAT:-png}
      DETECT_CROP_QUALITY: ${DETECT_CROP_QUALITY:-90}
      DETECT_CROP_PADDING: ${DETECT_CROP_PADDING:-0}

      # ---- 类别分组（默认与 yolov13 的类别表一致）----
      FORMULA_CLASSES: ${FORMULA_CLASSES:-InlineFormula,DisplayedFormulaLine,FormulaNumber,DisplayedFormulaBlock}
      TABLE_CLASSES: ${TABLE_CLASSES:-Table}
      FIGURE_CLASSES: ${FIGURE_CLASSES:-Figure}

    # 让 host.docker.internal 指向宿主机网关（Linux 需要；Docker Desktop 自带但仍兼容）
    # 把 .env 里的下游地址改成 http://host.docker.internal:9000 这类写法时，靠它才能解析。
    extra_hosts:
      - "host.docker.internal:host-gateway"

    # 纯转发服务，2G 足够（大 PDF 的 base64 会占一些内存，可按需调大）
    deploy:
      resources:
        limits:
          memory: 2g

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:${SERVICE_PORT:-9003}/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
