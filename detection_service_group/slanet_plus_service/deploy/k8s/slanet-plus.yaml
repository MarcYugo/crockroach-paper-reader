# SLANet_plus 表格结构识别服务 —— Kubernetes 部署清单
#
# 包含：Namespace / Deployment / Service / HPA
#
# 特点：
#   * SLANet_plus 模型很小（约 8MB），**默认按 CPU 部署**，靠多副本 + 进程内
#     predictor 池提供并发能力；需要 GPU 时见文件底部注释。
#   * 模型通过 hostPath 从宿主机挂载（单机/固定节点场景最简单）
#     若要用 PVC（多节点共享），见文件底部注释。
#   * 用 startupProbe 覆盖模型加载期（最长 5 分钟），就绪前不接流量。
#
# 应用：kubectl apply -f deploy/k8s/slanet-plus.yaml
# 注意：Namespace 与 pp-formulanet-plus-l 共用 formula-ocr，若已存在会报 AlreadyExists，可忽略。
---
apiVersion: v1
kind: Namespace
metadata:
  name: formula-ocr
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: slanet-plus
  namespace: formula-ocr
  labels:
    app: slanet-plus
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0     # 模型加载慢，先起新的再停旧的，避免服务中断
      maxSurge: 1
  selector:
    matchLabels:
      app: slanet-plus
  template:
    metadata:
      labels:
        app: slanet-plus
    spec:
      terminationGracePeriodSeconds: 30

      # 非 root 运行（镜像内 appuser uid=1000）
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000

      volumes:
        # ① 模型目录：宿主机路径，节点上必须先放好模型文件
        - name: model
          hostPath:
            path: /data/models/SLANet_plus   # ★ 改成你的实际路径
            type: Directory
        # ② 共享内存（Paddle 推理需要）
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
        - name: tmp
          emptyDir: {}

      containers:
        - name: api
          image: slanet-plus:3.0.0
          # 本地构建的镜像建议固定 digest 或使用私有仓库地址，例如：
          # image: registry.example.com/ocr/slanet-plus:3.0.0
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 9002

          env:
            # ---------- 模型 ----------
            - name: MODEL_NAME
              value: "SLANet_plus"
            - name: MODEL_DIR
              value: "/models/SLANet_plus"
            - name: DEVICE
              value: "cpu"                # CPU 部署；用 GPU 时改成 gpu:0 并申请 nvidia.com/gpu
            - name: PREDICTOR_POOL_SIZE      # 进程内并行推理路数
              value: "2"
            - name: CPU_THREADS
              value: "2"
            - name: ENABLE_MKLDNN
              value: "true"
            - name: USE_TENSORRT
              value: "false"
            - name: WARMUP
              value: "true"
            # ---------- 并发与限流 ----------
            - name: MAX_QUEUE
              value: "64"
            - name: QUEUE_TIMEOUT
              value: "30"
            - name: MAX_BATCH_SIZE
              value: "8"
            - name: WEB_CONCURRENCY          # 多进程会成倍占内存，一般保持 1
              value: "1"
            # ---------- 其它 ----------
            - name: PORT
              value: "9002"              # 与 containerPort / Service 保持一致
            - name: TEMP_DIR
              value: "/dev/shm/slanet-plus"
            - name: LOG_LEVEL
              value: "INFO"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name

          volumeMounts:
            - name: model
              mountPath: /models/SLANet_plus
              readOnly: true       # ★ 只读挂载，容器无法改动模型文件
            - name: dshm
              mountPath: /dev/shm
            - name: tmp
              mountPath: /tmp

          resources:
            requests:
              cpu: "500m"
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
              # ★ 用 GPU 时在这里加 nvidia.com/gpu: 1，
              #   并把 DEVICE 改成 gpu:0、DEVICE_STRICT 设为 true。

          # 启动探针：给模型加载留足时间（300s），失败才重启
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 60
            timeoutSeconds: 3

          # 就绪探针：模型真正加载完成后才开始接流量
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 6

          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]   # 优雅摘流

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false          # 需要写 /tmp 与缓存
            capabilities:
              drop: ["ALL"]

---
apiVersion: v1
kind: Service
metadata:
  name: slanet-plus
  namespace: formula-ocr
  labels:
    app: slanet-plus
spec:
  type: ClusterIP
  selector:
    app: slanet-plus
  ports:
    - name: http
      port: 9002
      targetPort: http
  sessionAffinity: None
---
# 横向扩容：按 CPU 触发。SLANet_plus 单副本吞吐很高，副本数按实际 QPS 调。
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: slanet-plus
  namespace: formula-ocr
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: slanet-plus
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60

# ---------------------------------------------------------------------------
# 多节点共享模型（PVC）写法：把上面的 hostPath volume 换成
#   volumes:
#     - name: model
#       persistentVolumeClaim:
#         claimName: slanet-plus-model   # ReadOnlyMany / ReadWriteMany
# 并预先用 kubectl cp、initContainer 或 job 把模型文件上传到该 PVC。
#
# 用 GPU 部署：
#   1) env 里 DEVICE=gpu:0、DEVICE_STRICT=true；
#   2) resources.limits 加 nvidia.com/gpu: 1；
#   3) template.spec 加
#        nodeSelector:
#          accelerator: nvidia-gpu
#        tolerations:
#          - key: nvidia.com/gpu
#            operator: Exists
#            effect: NoSchedule
#      （标签按你的集群实际情况改）
# ---------------------------------------------------------------------------
