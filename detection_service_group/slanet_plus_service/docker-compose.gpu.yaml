# GPU 覆盖文件（SLANet_plus）
#
# 只在宿主机有 NVIDIA 驱动 + nvidia-container-toolkit 时叠加：
#   docker compose -f docker-compose.yaml -f docker-compose.gpu.yaml up -d --build
# 或直接跑 ./docker-up.sh（自动探测 nvidia-smi 后决定是否叠加）。
#
# GPU 版 Paddle 在启动时需要可用的 NVIDIA 驱动；请确认宿主机驱动和
# nvidia-container-toolkit 正常，再使用本文件。DEVICE=auto 会选 gpu:0。
#
# 多卡机器上想固定某张卡，取消注释：
#   CUDA_VISIBLE_DEVICES: "0"

services:
  slanet-plus:
    environment:
      NVIDIA_VISIBLE_DEVICES: all
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
