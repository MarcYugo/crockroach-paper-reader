# YOLOv13 公式检测服务（纯 CPU 部署，无需 NVIDIA 驱动/工具包）
#
#   cd yolov13_formula_detection_service
#   docker compose -f docker-compose.cpu.yml up -d --build
#
# 说明：使用 CPU 版 torch（体积更小），推理速度明显低于 GPU，适合开发调试或小流量场景。
# 端口取自同目录 .env 的 PORT；本文件固定使用 CPU 版 torch，不受 .env 中 TORCH_INDEX_URL 影响。

services:
  formula-detection:
    build:
      # Dockerfile、inference.py 与 yolov13/ 源码都位于当前仓库根目录
      context: .
      dockerfile: Dockerfile
      args:
        TORCH_INDEX_URL: https://download.pytorch.org/whl/cpu
        TORCH_VERSION: "2.4.0"
        TORCHVISION_VERSION: "0.19.0"
    image: yolov13-formula-detection:cpu
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    environment:
      MODEL_PATH: /app/yolov13_formula_detection_service/models/yolov13_arxivformula_sft/yolov13s_ep5_bs32_lr_0.01.pt
      DEVICE: cpu
      IMGSZ: "640"
      CONF: "0.25"
      IOU: "0.7"
      MAX_DET: "300"
      BATCH: "4"
      DEDUP: "true"
      DEDUP_THR: "0.8"
      RETURN_CROPS: "true"
      CROP_FORMAT: png
      CROP_QUALITY: "90"
      CROP_PADDING: "0"
      WARMUP: "false"   # CPU 预热较慢，按需开启
      MAX_IMAGES: "50"
      MAX_PIXELS: "40000000"
      MAX_UPLOAD_MB: "30"
      SERVICE_PORT: "${PORT:-8000}"
      LOG_LEVEL: info
    volumes:
      - ./models/yolov13_arxivformula_sft/yolov13s_ep5_bs32_lr_0.01.pt:/app/yolov13_formula_detection_service/models/yolov13_arxivformula_sft/yolov13s_ep5_bs32_lr_0.01.pt:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:$${SERVICE_PORT:-$${PORT:-8000}}/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 300s
