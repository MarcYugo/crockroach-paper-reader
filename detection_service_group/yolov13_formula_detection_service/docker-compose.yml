# YOLOv13 公式检测服务（GPU 部署）
#
#   cd yolov13_formula_detection_service
#   docker compose up -d --build
#   curl -s http://127.0.0.1:9000/info      # 端口取自 .env 的 PORT
#
# 需要宿主机已安装 NVIDIA 驱动 + nvidia-container-toolkit；纯 CPU 部署请用 docker-compose.cpu.yml。

services:
  formula-detection:
    build:
      # Dockerfile、inference.py 与 yolov13/ 源码都位于当前仓库根目录
      context: .
      dockerfile: Dockerfile
      args:
        # 取自同目录 .env（见 .env 中的说明）
        TORCH_INDEX_URL: "${TORCH_INDEX_URL:-https://download.pytorch.org/whl/cu121}"
        TORCH_VERSION: "2.4.0"
        TORCHVISION_VERSION: "0.19.0"
        # .env 中置 1 可启用 wheels/ 中的 FlashAttention-2（Ampere 及以上 GPU 提速）
        INSTALL_FLASH_ATTN: "${INSTALL_FLASH_ATTN:-0}"
    image: yolov13-formula-detection:latest
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    environment:
      MODEL_PATH: /app/yolov13_formula_detection_service/models/yolov13_arxivformula_sft/yolov13s_ep5_bs32_lr_0.01.pt
      DEVICE: ""            # ""=自动选择；"0"=第一块 GPU；"cpu"=仅 CPU
      IMGSZ: "640"          # 与训练一致；小字号行内公式漏检时可试 960/1280
      CONF: "0.25"
      IOU: "0.7"
      MAX_DET: "300"
      BATCH: "8"            # 每批送入模型的页数
      DEDUP: "true"         # 同类框去重（公式框检查）
      DEDUP_THR: "0.8"
      RETURN_CROPS: "true"  # 返回框内区域图像（base64）
      CROP_FORMAT: png      # png / jpg
      CROP_QUALITY: "90"
      CROP_PADDING: "0"     # 框外扩像素数，0 表示严格按框裁剪
      WARMUP: "true"        # 启动时预热一次，避免首个请求超时
      MAX_IMAGES: "50"
      MAX_PIXELS: "40000000"
      MAX_UPLOAD_MB: "30"
      SERVICE_PORT: "${PORT:-8000}"
      LOG_LEVEL: info
    # 只挂载权重文件，避免 appuser 受宿主机 models/ 目录权限影响
    volumes:
      - ./models/yolov13_arxivformula_sft/yolov13s_ep5_bs32_lr_0.01.pt:/app/yolov13_formula_detection_service/models/yolov13_arxivformula_sft/yolov13s_ep5_bs32_lr_0.01.pt:ro
    shm_size: "2gb"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:$${SERVICE_PORT:-$${PORT:-8000}}/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 180s
