# ============================================================
#  PaddleOCR-VL-1.6 推理服务 (vLLM) —— Docker Compose
#
#  本文件 = CPU 版(vLLM CPU 后端; 实验性, 很慢, 仅用于没有 GPU 或先验证流程)。
#  GPU 版用覆盖文件叠加(见 docker-compose.gpu.yml):
#
#     CPU:  docker compose up -d --build
#     GPU:  docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d --build
#
#  日志: docker compose logs -f paddleocr-vl-vllm
#  停止: docker compose down
#
#  验证:
#     curl http://127.0.0.1:8080/health        # 引擎就绪后才返回 200
#     curl http://127.0.0.1:8080/v1/models     # 应看到 PaddleOCR-VL-1.6-0.9B
#
#  客户端(PaddleOCR SDK, 宿主机或其它容器里跑):
#     paddleocr doc_parser -i 某.pdf --pipeline_version v1.6 \
#       --vl_rec_backend vllm-server --vl_rec_server_url http://127.0.0.1:8080/v1
#
#  ---- 可调项: 放在同目录 .env 或当前 shell 环境变量里 ----
#     SERVE_PORT=8080        容器内监听端口(默认 8080, 与 surya:8060 / unlimited:8070 区分)
#     HOST_PORT=8080         宿主机映射端口(默认跟随 SERVE_PORT)
#     MODEL_HOST_DIR=./checkpoints/PaddleOCR-VL-1.6
#                            宿主机模型目录(默认就是本项目下载好的那个)
#     VLLM_DTYPE=bfloat16    CPU 版精度(CPU 推荐 bfloat16; GPU 版见 gpu.yml)
#     MAX_NUM_BATCHED_TOKENS=16384  单批最大 token 数(small GPU 显存紧张可调小)
#     MAX_MODEL_LEN=32768    上下文上限。模型本身支持 128k, 但文档解析是"一页/
#                            一块图 + 一段输出", 32k 足够, 限制它能省显存/内存;
#                            确实要长上下文再调大。
#     VLLM_CPU_KVCACHE_SPACE=4   CPU 专用: KV cache 大小(GiB)
#     VLLM_CPU_OMP_THREADS_BIND=auto  CPU 专用: OpenMP 绑核(auto / "0-15" / nobind)
#     CPU_BASE_IMAGE=vllm/vllm-openai-cpu:latest-x86_64
#                            CPU 基础镜像, 想锁版本写 vllm/vllm-openai-cpu:v0.11.1-x86_64
#
#  ⚠ 这里的 ${...} 是 Compose 在**解析 yaml 时**用 shell/.env 替换的, 不是容器内
#    环境变量。想改端口/精度请改 .env 后再 up, 不要用 `docker exec -e` 那种方式。
#
#  ⚠ 容器内路径固定为 /models/PaddleOCR-VL-1.6, 三处(挂载点/环境变量/--model)必须
#    保持一致; 只改宿主机侧用 MODEL_HOST_DIR 即可。
# ============================================================

name: paddleocr-vl

services:
  paddleocr-vl-vllm:
    build:
      context: .
      args:
        # CPU 版基础镜像(tag 必须带 -x86_64 后缀, 否则拉不到)
        BASE_IMAGE: "${CPU_BASE_IMAGE:-vllm/vllm-openai-cpu:latest-x86_64}"
    image: paddleocr-vl-vllm:cpu
    # container_name 是全局唯一的: 若之前手动 docker run 起过同名容器,
    # compose up 会直接失败, 需要先 docker rm -f 掉。
    container_name: paddleocr-vl-vllm
    ports:
      # 宿主机端口:容器内端口。右侧跟 SERVE_PORT(服务真正监听的端口),
      # 左侧默认跟随右侧, 只改 .env 里 SERVE_PORT 一处即可;
      # 想让宿主机端口与容器内不同时再额外设 HOST_PORT。
      - "${HOST_PORT:-${SERVE_PORT:-8080}}:${SERVE_PORT:-8080}"
    volumes:
      # 模型不进镜像: 运行时把宿主机模型目录以只读方式直接挂进容器。
      # ⚠ 路径写错时 Docker 会静默建一个空目录(短语法关不掉该行为), 换路径后
      #   请确认挂载点里确实有 config.json / model.safetensors / tokenizer.json。
      # (容器以 root 运行, 读只读挂载没问题, 不用 chmod)
      - "${MODEL_HOST_DIR:-./checkpoints/PaddleOCR-VL-1.6}:/models/PaddleOCR-VL-1.6:ro"
      # vLLM 的 torch.compile/inductor 编译产物缓存, 挂上后第二次启动快很多
      - vllm-cache:/root/.cache/vllm
    environment:
      # 容器内监听端口(与上面 ports 右侧、healthcheck 用的是同一个变量)
      SERVE_PORT: "${SERVE_PORT:-8080}"
      # CPU 后端专用: KV cache 大小(GiB, 默认 4)。越大并发/上下文越高, 注意内存。
      VLLM_CPU_KVCACHE_SPACE: "${VLLM_CPU_KVCACHE_SPACE:-4}"
      # CPU 后端专用: OpenMP 线程绑定。auto = 按 NUMA 自动绑核(推荐);
      # 也可写 CPU 号列表如 "0-15", 或 "nobind" 关闭绑定。
      VLLM_CPU_OMP_THREADS_BIND: "${VLLM_CPU_OMP_THREADS_BIND:-auto}"
    # vLLM 基于 torch 多进程, 依赖共享内存; 太小会报 Bus error /
    # "Unable to create shared memory"(用 ipc: host 或 shm_size 都可以, 这里按官方推荐)
    ipc: host
    # CPU 版被 seccomp 拦掉 migrate_pages / get_mempolicy 时, 日志会刷
    # "get_mempolicy: Operation not permitted" —— 功能不受影响, 只是 NUMA 优化失效。
    # 这两项是官方给的最小豁免; GPU 版不需要, 叠加 gpu.yml 后留着也无害。
    cap_add:
      - SYS_NICE
    security_opt:
      - seccomp:unconfined
    # 启动参数(等价于 `docker run <镜像> 这串参数`; 基础镜像的 ENTRYPOINT 就是
    # vLLM 的 serve 入口, 所以这里直接给参数即可)。
    # --trust-remote-code: 模型仓库里带自定义 modeling/processing 代码, 必须开。
    # --no-enable-prefix-caching / --mm-processor-cache-gb 0: 官方建议 ——
    #   OCR 场景不存在多轮复用同一图片, 开前缀缓存只会白白做哈希和占内存。
    # --served-model-name: 挂两个别名, 兼容 PaddleOCR 客户端可能发来的不同 model 名。
    command: >
      --model /models/PaddleOCR-VL-1.6
      --served-model-name PaddleOCR-VL-1.6-0.9B PaddleOCR-VL-0.9B
      --trust-remote-code
      --host 0.0.0.0
      --port ${SERVE_PORT:-8080}
      --dtype ${VLLM_DTYPE:-bfloat16}
      --max-num-batched-tokens ${MAX_NUM_BATCHED_TOKENS:-16384}
      --max-model-len ${MAX_MODEL_LEN:-32768}
      --no-enable-prefix-caching
      --mm-processor-cache-gb 0
    restart: unless-stopped

volumes:
  # 编译缓存: 不用 bind mount, 免得宿主机目录 uid/权限带来的麻烦
  vllm-cache:
