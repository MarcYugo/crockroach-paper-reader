<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>阅读论文</title>
  <link rel="stylesheet" href="css/style.css">
  <!-- 首屏先把主题套上：等 CSS/JS 加载完再切会闪一下白 -->
  <script>try{if(localStorage.getItem("paperReader.theme")==="dark")document.documentElement.classList.add("dark");}catch(e){}</script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="./">← 论文列表</a>
    <h1 class="doc-title" id="docTitle">加载中…</h1>
    <span class="share-badge" id="shareBadge" hidden></span>
    <div class="top-actions">
      <label class="chk"><input type="checkbox" id="chkShowZh"> 显示译文</label>
      <label class="chk"><input type="checkbox" id="chkShowNotes" checked> 显示笔记</label>
      <button class="btn" id="btnPageTrans" title="翻译当前页全部英文段落">翻译本页</button>
      <button class="btn" id="btnAllTrans" title="翻译全文(批量可取消)">翻译全文</button>
      <button class="btn ghost" id="btnFinished">标记读完</button>
      <span class="icon-btn" id="zoomOut" title="缩小">−</span>
      <span class="chk" id="zoomVal" style="min-width:40px;justify-content:center">100%</span>
      <button class="icon-btn" id="zoomIn" title="放大">＋</button>
      <button class="btn ghost" id="btnShare" hidden
              title="把这篇论文（连同笔记/高亮/译文/AI 整理）共享给别的账号">🔗 共享</button>
      <button class="btn ghost" id="btnToc" title="目录：优先用 PDF 自带书签，没有就让 LLM 从全文提取">📑 目录</button>
      <button class="btn ghost" id="btnReparse"
              title="用这篇论文的原始 PDF 重新解析版式（解析器升级/换了 OCR 后端后用；笔记、高亮、译文、进度都保留）">🔄 重解析</button>
      <input type="file" id="reparseFile" accept="application/pdf,.pdf" hidden>
      <button class="btn primary" id="btnNotes">📝 笔记 <span id="notesCount">0</span></button>
    </div>
  </header>

  <div class="notice" id="notice" hidden></div>
  <div class="trans-progress" id="transProgress" hidden>
    <div class="bar"><i id="tpBar"></i></div>
    <span id="tpText">0 / 0</span>
    <button class="cancel" id="tpCancel">取消</button>
  </div>

  <main class="reader-main" id="readerMain">
    <div class="pages" id="pages"></div>

    <!-- 页码：点数字→输页号→回车跳转（Esc 取消） -->
    <div class="pageind" id="pageInd" title="输入页码后按回车跳转 （Esc 取消）">
      <input class="pagein" id="pageIn" type="text" inputmode="numeric" maxlength="4"
             autocomplete="off" aria-label="输入页码跳转" placeholder="-">
      <span class="psep">/</span>
      <b id="pageTotal">-</b>
    </div>
  </main>

  <!-- 文末 · AI 辅助阅读：左边聊思路，右边是笔记整理（读到 ≥95% 自动整理一次）。
       放在 .reader-main 之外：它不需要为右侧批注栏留白，否则整理框会被挤得很窄。 -->
  <section class="ai-end" id="aiEnd">
    <div class="ai-in">
      <div class="ai-head">
        <b><i class="ai-mark" aria-hidden="true"></i>AI 辅助阅读</b>
        <span class="ai-sub" id="aiSub"></span>
        <span class="grow"></span>
        <button class="btn ghost" id="aiRegen" type="button" title="按当前笔记重新整理一次">重新整理</button>
        <button class="btn ghost" id="aiClear" type="button" title="只清掉对话，整理结果保留">清空对话</button>
      </div>
      <div class="ai-body" id="aiBody">
        <div class="ai-chat" id="aiChat">
          <div class="ai-msgs" id="aiMsgs"></div>
          <div class="ai-send">
            <textarea id="aiText" rows="2" spellcheck="false"
                      placeholder="就这篇论文或你的笔记提问（Enter 发送，Shift+Enter 换行）"></textarea>
            <button class="btn primary" id="aiSend" type="button">发送</button>
          </div>
        </div>
        <div class="ai-sum" id="aiSum"></div>
      </div>
    </div>
  </section>

  <!-- 左侧目录：PDF 自带书签直接用；没有书签时可用 LLM 读全文提取 -->
  <aside class="toc-panel" id="tocPanel">
    <div class="sp-head">
      <b>📑 目录</b>
      <span class="cnt" id="tocCount"></span>
      <button class="sp-close" id="tocClose" title="收起">×</button>
    </div>
    <div class="toc-list" id="tocList"></div>

    <!-- 目录旁的独立一块：AI 辅助阅读（靠分隔线隔开，与目录内容不是一个整体） -->
    <div class="toc-ai" id="tocAi">
      <div class="toc-ai-head">
        <b><i class="ai-mark" aria-hidden="true"></i>AI 辅助阅读</b>
        <span class="cnt" id="tocAiState"></span>
      </div>
      <div class="toc-ai-list" id="tocAiList"></div>
      <button class="toc-ai-go" id="tocAiGo" type="button">去文末看整理 / 聊一聊 →</button>
    </div>

    <div class="toc-foot" id="tocFoot"></div>
  </aside>

  <!-- 右侧“全部笔记”总览（笔记正文内嵌在正文句下方，这里只做一览/定位） -->
  <aside class="side-panel" id="side">
    <div class="sp-head">
      <b>📝 全部笔记</b>
      <span class="cnt" id="spCount"></span>
      <button class="sp-close" id="closeSide" title="收起">×</button>
    </div>
    <div class="sp-list" id="spList"></div>
  </aside>

  <!-- 选中句子后的浮动工具条（不显示选中内容预览，只放操作按钮） -->
  <div class="fbar" id="fbar" hidden>
    <button data-a="trans" id="fbTrans">翻译</button>
    <span class="sep"></span>
    <button data-a="hl" id="fbHl">标注</button>
    <button data-a="note" id="fbNote">笔记</button>
    <button data-a="copy" id="fbCopy">复制</button>
    <span class="sep"></span>
    <button data-a="close" id="fbClose" style="color:#9fb0c8">✕</button>
    <div class="hmenu" id="hmenu">
      <!-- 6 个色块由 JS 按调色盘渲染（前 3 个默认，后 3 个可自定义） -->
      <div class="swatches"></div>
      <div class="swedit">
        <span class="lbl">自定义</span>
        <input type="color" title="自定义颜色 1">
        <input type="color" title="自定义颜色 2">
        <input type="color" title="自定义颜色 3">
      </div>
      <button data-a="hlclear">清除高亮</button>
    </div>
  </div>

  <div id="toast"></div>

\/td><td>1.23<\/td><\/tr><\/table>", "surya": true, "lines": [{"x": 112.5, "y": 645.0, "w": 375.0, "h": 41.25, "runs": [{"t": "Method | Loss\nTTT-E2E | 1.23"}], "s": 9.76}], "size": 9.76, "line_h": 12.68}], "images": [{"x": 93.0, "y": 400.5, "w": 422.25, "h": 166.125, "file": "test_p001_b006_Figure.png", "source": "surya", "class_name": "Figure", "cache_key": "3945c695ff3f"}], "text": "arXiv:2512.23675v2 [cs.LG] 31 Dec 2025\n\nEnd-to-End Test-Time Training for Long Context\n\nArnuv Tandon*1,3, Karan Dalal*1,4, Xinhao Li*5, Daniel Koceja*3, Marcel Rød*3, Sam Buchanan4, Xiaolong Wang5, Jure Leskovec3, Sanmi Koyejo3, Tatsunori Hashimoto3, Carlos Guestrin3, Jed McCaleb1, Yejin Choi2, Yu Sun*2,3\n\n1 Astera Institute 2 NVIDIA 3 Stanford University 4 UC Berkeley 5 UC San Diego\n\nAbstract\n\nWe formulate long-context language modeling as a problem in continual learning rather than architecture design. Under this formulation, we only use a standard architecture – a Transformer with sliding-window attention. However, our model continues learning at test time via next-token prediction on the given context, compressing the context it reads into its weights. In addition, we improve the model’s initialization for learning at test time via meta-learning at training time. Overall, our method, a form of Test-Time Training (TTT), is End-to-End (E2E) both at test time (via next-token prediction) and training time (via meta-learning), in contrast to previous forms. We conduct extensive experiments with a focus on scaling properties. In particular, for 3B models trained with 164B tokens, our method (TTT-E2E) scales with context length in the same way as Transformer with full attention, while others, such as Mamba 2 and Gated DeltaNet, do not. However, similar to RNNs, TTT-E2E has constant inference latency regardless of context length, making it 2.7× faster than full attention for 128K context. Our code is publicly available.\n\nFigure 1. Scaling with context length, in terms of test loss (left) and latency (right). Left: Our method (TTT-E2E) turns the worst line (green) into the best (blue) at 128K context length. Loss \\Delta (↓), the y-value, is computed as (loss of the reported method) – (loss of Transformer with full attention), so loss \\Delta of full attention itself (orange) is the flat line at y = 0. While other methods produce worse loss \\Delta in longer context, TTT-E2E maintains the same advantage over full attention. All models have 3B parameters and are trained with 164B tokens. Right: Similar to SWA and the RNN baselines, TTT-E2E has constant inference latency regardless of context length, making it 2.7× faster than full attention for 128K context on an H100.\n\n* Core contributors. See statement of contributions before references.\nCorrespondence to: arnuv@stanford.edu, kdalal@berkeley.edu, yusun@cs.stanford.edu.\n\n1\n\nMethod | Loss\nTTT-E2E | 1.23"}, {"w": 612.0, "h": 792.0, "texts": [{"id": "p2b0", "kind": "heading", "label": "SectionHeader", "raw_label": "Section-Header", "x": 86.625, "y": 86.25, "w": 111.75, "h": 16.5, "text": "1 Introduction", "math": [], "html": "<h1>1 Introduction<\/h1>", "surya": true, "lines": [{"x": 86.625, "y": 86.25, "w": 111.75, "h": 16.5, "runs": [{"t": "1 Introduction"}], "s": 12.98}], "level": 1, "size": 12.98, "line_h": 16.22}, {"id": "p2b1", "kind": "text", "label": "Text", "raw_label": "Text", "x": 86.625, "y": 112.5, "w": 438.375, "h": 49.5, "text": "Humans are able to improve themselves with more experience throughout their lives, despite their imperfect recall of the exact details. Consider your first lecture in machine learning: You might not recall the instructor's first word during the lecture, but the intuition you learned is probably helping you understand this paper, even if that lecture happened years ago.", "math": [], "html": "<p>Humans are able to improve themselves with more experience throughout their lives, despite their imperfect recall of the exact details. Consider your first lecture in machine learning: You might not recall the instructor's first word during the lecture, but the intuition you learned is probably helping you understand this paper, even if that lecture happened years ago.<\/p>", "surya": true, "lines": [{"x": 86.625, "y": 112.5, "w": 438.375, "h": 49.5, "runs": [{"t": "Humans are able to improve themselves with more experience throughout their lives, despite their imperfect recall of the exact details. Consider your first lecture in machine learning: You might not recall the instructor's first word during the lecture, but the intuition you learned is probably helping you understand this paper, even if that lecture happened years ago."}], "s": 8.35}], "size": 8.35, "line_h": 11.86}, {"id": "p2b2", "kind": "text", "label": "Text", "raw_label": "Text", "x": 86.625, "y": 166.125, "w": 438.375, "h": 60.75, "text": "On the other hand, Transformers with self-attention still struggle to efficiently process long context equivalent to years of human experience, in part because they are designed for nearly lossless recall. Self-attention over the full context, also known as full attention, must scan through the keys and values of all previous tokens for every new token. As a consequence, it readily attends to every detail, but its cost per token grows linearly with context length and quickly becomes prohibitive.", "math": [], "html": "<p>On the other hand, Transformers with self-attention still struggle to efficiently process long context equivalent to years of human experience, in part because they are designed for nearly lossless recall. Self-attention over the full context, also known as full attention, must scan through the keys and values of all previous tokens for every new token. As a consequence, it readily attends to every detail, but its cost per token grows linearly with context length and quickly becomes prohibitive.<\/p>", "surya": true, "lines": [{"x": 86.625, "y": 166.125, "w": 438.375, "h": 60.75, "runs": [{"t": "On the other hand, Transformers with self-attention still struggle to efficiently process long context equivalent to years of human experience, in part because they are designed for nearly lossless recall. Self-attention over the full context, also known as full attention, must scan through the keys and values of all previous tokens for every new token. As a consequence, it readily attends to every detail, but its cost per token grows linearly with context length and quickly becomes prohibitive."}], "s": 7.97}], "size": 7.97, "line_h": 11.32}, {"id": "p2b3", "kind": "text", "label": "Text", "raw_label": "Text", "x": 86.625, "y": 231.0, "w": 438.375, "h": 61.875, "text": "As an alternative to Transformers, RNNs such as Mamba 2 [32] and Gated DeltaNet [104] have constant cost per token, but become less effective in longer context, as shown in Figure 1. Some modern architectures approximate full attention with a sliding window [1, 107], or stack attention and RNN layers together [91, 11]. However, these techniques are still less effective than full attention in using longer context to achieve better performance in language modeling.", "math": [], "html": "<p>As an alternative to Transformers, RNNs such as Mamba 2 [32] and Gated DeltaNet [104] have constant cost per token, but become less effective in longer context, as shown in Figure 1. Some modern architectures approximate full attention with a sliding window [1, 107], or stack attention and RNN layers together [91, 11]. However, these techniques are still less effective than full attention in using longer context to achieve better performance in language modeling.<\/p>", "surya": true, "lines": [{"x": 86.625, "y": 231.0, "w": 438.375, "h": 61.875, "runs": [{"t": "As an alternative to Transformers, RNNs such as Mamba 2 [32] and Gated DeltaNet [104] have constant cost per token, but become less effective in longer context, as shown in Figure 1. Some modern architectures approximate full attention with a sliding window [1, 107], or stack attention and RNN layers together [91, 11]. However, these techniques are still less effective than full attention in using longer context to achieve better performance in language modeling."}], "s": 8.32}], "size": 8.32, "line_h": 11.82}, {"id": "p2b4", "kind": "text", "label": "Text", "raw_label": "Text", "x": 86.625, "y": 296.25, "w": 438.375, "h": 85.875, "text": "How can we design an effective method for language modeling with only constant cost per token? Specifically, how can we achieve better performance in longer context without recalling every detail, as in the opening example? The key mechanism is compression. For example, humans compress a massive amount of experience into their brains, which preserve the important information while leaving out many details. For language models, training with next-token prediction also compresses a massive amount of data into their weights. So what if we just continue training the language model at test time via next-token prediction on the given context?", "math": [], "html": "<p>How can we design an effective method for language modeling with only constant cost per token? Specifically, how can we achieve better performance in longer context without recalling every detail, as in the opening example? The key mechanism is compression. For example, humans compress a massive amount of experience into their brains, which preserve the important information while leaving out many details. For language models, training with next-token prediction also compresses a massive amount of data into their weights. So what if we just continue training the language model at test time via next-token prediction on the given context?<\/p>", "surya": true, "lines": [{"x": 86.625, "y": 296.25, "w": 438.375, "h": 85.875, "runs": [{"t": "How can we design an effective method for language modeling with only constant cost per token? Specifically, how can we achieve better performance in longer context without recalling every detail, as in the opening example? The key mechanism is compression. For example, humans compress a massive amount of experience into their brains, which preserve the important information while leaving out many details. For language models, training with next-token prediction also compresses a massive amount of data into their weights. So what if we just continue training the language model at test time via next-token prediction on the given context?"}], "s": 8.35}], "size": 8.35, "line_h": 11.86}, {"id": "p2b5", "kind": "text", "label": "Text", "raw_label": "Text", "x": 86.625, "y": 386.25, "w": 438.375, "h": 85.5, "text": "This form of Test-Time Training (TTT), similar to an old idea known as dynamic evaluation [72, 60], still has a missing piece: At training time, we were optimizing the model for its loss out of the box, not for its loss after TTT. To resolve this mismatch, we prepare the model's initialization for TTT via meta-learning [38, 79, 58] instead of standard pre-training. Specifically, each training sequence is first treated as if it were a test sequence, so we perform TTT on it in the inner loop. Then we average the loss after TTT over many independent training sequences, and optimize this average w.r.t. the model's initialization for TTT through gradients of gradients in the outer loop [71, 3, 27].", "math": [], "html": "<p>This form of Test-Time Training (TTT), similar to an old idea known as dynamic evaluation [72, 60], still has a missing piece: At training time, we were optimizing the model for its loss out of the box, not for its loss after TTT. To resolve this mismatch, we prepare the model's initialization for TTT via meta-learning [38, 79, 58] instead of standard pre-training. Specifically, each training sequence is first treated as if it were a test sequence, so we perform TTT on it in the inner loop. Then we average the loss after TTT over many independent training sequences, and optimize this average w.r.t. the model's initialization for TTT through gradients of gradients in the outer loop [71, 3, 27].<\/p>", "surya": true, "lines": [{"x": 86.625, "y": 386.25, "w": 438.375, "h": 85.5, "runs": [{"t": "This form of Test-Time Training (TTT), similar to an old idea known as dynamic evaluation [72, 60], still has a missing piece: At training time, we were optimizing the model for its loss out of the box, not for its loss after TTT. To resolve this mismatch, we prepare the model's initialization for TTT via meta-learning [38, 79, 58] instead of standard pre-training. Specifically, each training sequence is first treated as if it were a test sequence, so we perform TTT on it in the inner loop. Then we average the loss after TTT over many independent training sequences, and optimize this average w.r.t. the model's initialization for TTT through gradients of gradients in the outer loop [71, 3, 27]."}], "s": 7.98}], "size": 7.98, "line_h": 11.33}, {"id": "p2b6", "kind": "text", "label": "Text", "raw_label": "Text", "x": 86.625, "y": 475.125, "w": 438.375, "h": 62.25, "text": "In summary, our method is end-to-end in two ways. Our inner loop directly optimizes the next-token prediction loss at the end of the network, in contrast to prior work on long-context TTT [86, 110]; Subsection 2.4 explains this difference through an alternative derivation of our method. Moreover, our outer loop directly optimizes the final loss after TTT, in contrast to dynamic evaluation [72, 60], as discussed. Our key results are highlighted in Figure 1, with the rest presented in Section 3.", "math": [], "html": "<p>In summary, our method is end-to-end in two ways. Our inner loop directly optimizes the next-token prediction loss at the end of the network, in contrast to prior work on long-context TTT [86, 110]; Subsection 2.4 explains this difference through an alternative derivation of our method. Moreover, our outer loop directly optimizes the final loss after TTT, in contrast to dynamic evaluation [72, 60], as discussed. Our key results are highlighted in Figure 1, with the rest presented in Section 3.<\/p>", "surya": true, "lines": [{"x": 86.625, "y": 475.125, "w": 438.375, "h": 62.25, "runs": [{"t": "In summary, our method is end-to-end in two ways. Our inner loop directly optimizes the next-token prediction loss at the end of the network, in contrast to prior work on long-context TTT [86, 110]; Subsection 2.4 explains this difference through an alternative derivation of our method. Moreover, our outer loop directly optimizes the final loss after TTT, in contrast to dynamic evaluation [72, 60], as discussed. Our key results are highlighted in Figure 1, with the rest presented in Section 3."}], "s": 8.08}], "size": 8.08, "line_h": 11.48}, {"id": "p2b7", "kind": "text", "label": "Text", "raw_label": "Text", "x": 86.625, "y": 541.5, "w": 438.375, "h": 49.125, "text": "The conceptual framework of TTT has a long history with many applications beyond long context, and many forms without meta-learning [85, 12, 45, 2]. Our work is also inspired by the literature on fast weights [38, 79, 77, 49], especially [17] by Clark et al., which shares our high-level approach. Section 4 discusses related work in detail.", "math": [], "html": "<p>The conceptual framework of TTT has a long history with many applications beyond long context, and many forms without meta-learning [85, 12, 45, 2]. Our work is also inspired by the literature on fast weights [38, 79, 77, 49], especially [17] by Clark et al., which shares our high-level approach. Section 4 discusses related work in detail.<\/p>", "surya": true, "lines": [{"x": 86.625, "y": 541.5, "w": 438.375, "h": 49.125, "runs": [{"t": "The conceptual framework of TTT has a long history with many applications beyond long context, and many forms without meta-learning [85, 12, 45, 2]. Our work is also inspired by the literature on fast weights [38, 79, 77, 49], especially [17] by Clark et al., which shares our high-level approach. Section 4 discusses related work in detail."}], "s": 8.68}], "size": 8.68, "line_h": 12.32}, {"id": "p2b8", "kind": "heading", "label": "SectionHeader", "raw_label": "Section-Header", "x": 86.625, "y": 608.25, "w": 78.75, "h": 15.75, "text": "2 Method", "math": [], "html": "<h1>2 Method<\/h1>", "surya": true, "lines": [{"x": 86.625, "y": 608.25, "w": 78.75, "h": 15.75, "runs": [{"t": "2 Method"}], "s": 12.98}], "level": 1, "size": 12.98, "line_h": 16.22}, {"id": "p2b9", "kind": "text", "label": "Text", "raw_label": "Text", "x": 86.625, "y": 632.625, "w": 420.375, "h": 14.25, "text": "Consider the standard task of next-token prediction, which consists of two phases at test time:", "math": [], "html": "<p>Consider the standard task of next-token prediction, which consists of two phases at test time:<\/p>", "surya": true, "lines": [{"x": 86.625, "y": 632.625, "w": 420.375, "h": 14.25, "runs": [{"t": "Consider the standard task of next-token prediction, which consists of two phases at test time:"}], "s": 8.67}], "size": 8.67, "line_h": 12.31}, {"id": "p2b10", "kind": "list", "label": "ListGroup", "raw_label": "List-Group", "x": 101.625, "y": 647.625, "w": 423.375, "h": 41.25, "text": "• Prefill: conditioning on T + 1 given tokens x_0, x_1, \\dots, x_T, where x_0 is the Beginning of Sequence (<\\text{BOS}>) token.\n• Decode: predicting a distribution \\hat{p}_{T+1} over all possible instantiations of the next token.", "math": [{"a": 27, "b": 32, "latex": "T + 1"}, {"a": 46, "b": 66, "latex": "x_0, x_1, \\dots, x_T"}, {"a": 74, "b": 77, "latex": "x_0"}, {"a": 108, "b": 120, "latex": "<\\text{BOS}>"}, {"a": 165, "b": 178, "latex": "\\hat{p}_{T+1}"}], "html": "<ul><li>• Prefill: conditioning on <math>T + 1<\/math> given tokens <math>x_0, x_1, \\dots, x_T<\/math>, where <math>x_0<\/math> is the Beginning of Sequence (<math>&lt;\\text{BOS}&gt;<\/math>) token.<\/li><li>• Decode: predicting a distribution <math>\\hat{p}_{T+1}<\/math> over all possible instantiations of the next token.<\/li><\/ul>", "surya": true, "lines": [{"x": 101.625, "y": 647.625, "w": 423.375, "h": 41.25, "runs": [{"t": "• Prefill: conditioning on T + 1 given tokens x_0, x_1, \\dots, x_T, where x_0 is the Beginning of Sequence (<\\text{BOS}>) token.\n• Decode: predicting a distribution \\hat{p}_{T+1} over all possible instantiations of the next token."}], "s": 8.95}], "size": 8.95, "line_h": 12.71}, {"id": "p2b11", "kind": "text", "label": "Text", "raw_label": "Text", "x": 86.625, "y": 689.625, "w": 435.0, "h": 15.0, "text": "The test loss is then \\text{CE}(\\hat{p}_{T+1}, x_{T+1}), where \\text{CE} is the cross entropy and x_{T+1} is generated by nature.", "math": [{"a": 22, "b": 55, "latex": "\\text{CE}(\\hat{p}_{T+1}, x_{T+1})"}, {"a": 63, "b": 72, "latex": "\\text{CE}"}, {"a": 98, "b": 105, "latex": "x_{T+1}"}], "html": "<p>The test loss is then <math>\\text{CE}(\\hat{p}_{T+1}, x_{T+1})<\/math>, where <math>\\text{CE}<\/math> is the cross entropy and <math>x_{T+1}<\/math> is generated by nature.<\/p>", "surya": true, "lines": [{"x": 86.625, "y": 689.625, "w": 435.0, "h": 15.0, "runs": [{"t": "The test loss is then \\text{CE}(\\hat{p}_{T+1}, x_{T+1}), where \\text{CE} is the cross entropy and x_{T+1} is generated by nature."}], "s": 7.77}], "size": 7.77, "line_h": 11.03}, {"id": "p2b12", "kind": "footer", "label": "PageFooter", "raw_label": "Page-Footer", "x": 299.25, "y": 720.75, "w": 11.625, "h": 13.125, "text": "2", "math": [], "html": "<p>2<\/p>", "surya": true, "lines": [{"x": 299.25, "y": 720.75, "w": 11.625, "h": 13.125, "runs": [{"t": "2"}], "s": 7.88}], "size": 7.88, "line_h": 10.4}], "images": [], "text": "1 Introduction\n\nHumans are able to improve themselves with more experience throughout their lives, despite their imperfect recall of the exact details. Consider your first lecture in machine learning: You might not recall the instructor's first word during the lecture, but the intuition you learned is probably helping you understand this paper, even if that lecture happened years ago.\n\nOn the other hand, Transformers with self-attention still struggle to efficiently process long context equivalent to years of human experience, in part because they are designed for nearly lossless recall. Self-attention over the full context, also known as full attention, must scan through the keys and values of all previous tokens for every new token. As a consequence, it readily attends to every detail, but its cost per token grows linearly with context length and quickly becomes prohibitive.\n\nAs an alternative to Transformers, RNNs such as Mamba 2 [32] and Gated DeltaNet [104] have constant cost per token, but become less effective in longer context, as shown in Figure 1. Some modern architectures approximate full attention with a sliding window [1, 107], or stack attention and RNN layers together [91, 11]. However, these techniques are still less effective than full attention in using longer context to achieve better performance in language modeling.\n\nHow can we design an effective method for language modeling with only constant cost per token? Specifically, how can we achieve better performance in longer context without recalling every detail, as in the opening example? The key mechanism is compression. For example, humans compress a massive amount of experience into their brains, which preserve the important information while leaving out many details. For language models, training with next-token prediction also compresses a massive amount of data into their weights. So what if we just continue training the language model at test time via next-token prediction on the given context?\n\nThis form of Test-Time Training (TTT), similar to an old idea known as dynamic evaluation [72, 60], still has a missing piece: At training time, we were optimizing the model for its loss out of the box, not for its loss after TTT. To resolve this mismatch, we prepare the model's initialization for TTT via meta-learning [38, 79, 58] instead of standard pre-training. Specifically, each training sequence is first treated as if it were a test sequence, so we perform TTT on it in the inner loop. Then we average the loss after TTT over many independent training sequences, and optimize this average w.r.t. the model's initialization for TTT through gradients of gradients in the outer loop [71, 3, 27].\n\nIn summary, our method is end-to-end in two ways. Our inner loop directly optimizes the next-token prediction loss at the end of the network, in contrast to prior work on long-context TTT [86, 110]; Subsection 2.4 explains this difference through an alternative derivation of our method. Moreover, our outer loop directly optimizes the final loss after TTT, in contrast to dynamic evaluation [72, 60], as discussed. Our key results are highlighted in Figure 1, with the rest presented in Section 3.\n\nThe conceptual framework of TTT has a long history with many applications beyond long context, and many forms without meta-learning [85, 12, 45, 2]. Our work is also inspired by the literature on fast weights [38, 79, 77, 49], especially [17] by Clark et al., which shares our high-level approach. Section 4 discusses related work in detail.\n\n2 Method\n\nConsider the standard task of next-token prediction, which consists of two phases at test time:\n\n• Prefill: conditioning on T + 1 given tokens x_0, x_1, \\dots, x_T, where x_0 is the Beginning of Sequence (<\\text{BOS}>) token.\n• Decode: predicting a distribution \\hat{p}_{T+1} over all possible instantiations of the next token.\n\nThe test loss is then \\text{CE}(\\hat{p}_{T+1}, x_{T+1}), where \\text{CE} is the cross entropy and x_{T+1} is generated by nature.\n\n2"}, {"w": 612.0, "h": 792.0, "texts": [{"id": "p3b1", "kind": "caption", "label": "Caption", "raw_label": "Caption", "x": 86.625, "y": 261.375, "w": 441.0, "h": 80.625, "text": "Figure 2. Toy example. Left: Given x_1 and x_2 as context, we want to predict the unknown x_3. Our toy baseline, a Transformer without self-attention (using only the upward arrows), is effectively a bigram since it has no memory of x_1. TTT (using all the arrows) first tries to predict x_2 from x_1 as an exercise: It computes the loss \\ell_2 between x_2 and the prediction \\hat{p}_2, then takes a gradient step on \\ell_2. Now information of x_1 is stored in the updated MLPs (blue). Right: Token-level test loss \\ell_t for various methods in our toy example, as discussed in Subsection 2.2, except for TTT-E2E b = 16 discussed in Subsection 2.3. In particular, TTT-E2E b = 1 turns the green line (our toy baseline) into the blue line, which performs almost as well as orange (using full attention).", "math": [{"a": 35, "b": 38, "latex": "x_1"}, {"a": 43, "b": 46, "latex": "x_2"}, {"a": 90, "b": 93, "latex": "x_3"}, {"a": 232, "b": 235, "latex": "x_1"}, {"a": 287, "b": 290, "latex": "x_2"}, {"a": 296, "b": 299, "latex": "x_1"}, {"a": 337, "b": 343, "latex": "\\ell_2"}, {"a": 352, "b": 355, "latex": "x_2"}, {"a": 375, "b": 384, "latex": "\\hat{p}_2"}, {"a": 416, "b": 422, "latex": "\\ell_2"}, {"a": 443, "b": 446, "latex": "x_1"}, {"a": 514, "b": 520, "latex": "\\ell_t"}, {"a": 612, "b": 618, "latex": "b = 16"}, {"a": 671, "b": 676, "latex": "b = 1"}], "html": "<p>Figure 2. Toy example. <b>Left:<\/b> Given <math>x_1<\/math> and <math>x_2<\/math> as context, we want to predict the unknown <math>x_3<\/math>. Our toy baseline, a Transformer without self-attention (using only the upward arrows), is effectively a bigram since it has no memory of <math>x_1<\/math>. TTT (using all the arrows) first tries to predict <math>x_2<\/math> from <math>x_1<\/math> as an exercise: It computes the loss <math>\\ell_2<\/math> between <math>x_2<\/math> and the prediction <math>\\hat{p}_2<\/math>, then takes a gradient step on <math>\\ell_2<\/math>. Now information of <math>x_1<\/math> is stored in the updated MLPs (blue). <b>Right:<\/b> Token-level test loss <math>\\ell_t<\/math> for various methods in our toy example, as discussed in Subsection 2.2,
