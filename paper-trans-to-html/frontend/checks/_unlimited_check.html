<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>阅读论文</title>
  <link rel="stylesheet" href="css/style.css">
  <!-- 首屏先把主题套上：等 CSS/JS 加载完再切会闪一下白 -->
  <script>try{if(localStorage.getItem("paperReader.theme")==="dark")document.documentElement.classList.add("dark");}catch(e){}</script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="./">← 论文列表</a>
    <h1 class="doc-title" id="docTitle">加载中…</h1>
    <span class="share-badge" id="shareBadge" hidden></span>
    <div class="top-actions">
      <label class="chk"><input type="checkbox" id="chkShowZh"> 显示译文</label>
      <label class="chk"><input type="checkbox" id="chkShowNotes" checked> 显示笔记</label>
      <button class="btn" id="btnPageTrans" title="翻译当前页全部英文段落">翻译本页</button>
      <button class="btn" id="btnAllTrans" title="翻译全文(批量可取消)">翻译全文</button>
      <button class="btn ghost" id="btnFinished">标记读完</button>
      <span class="icon-btn" id="zoomOut" title="缩小">−</span>
      <span class="chk" id="zoomVal" style="min-width:40px;justify-content:center">100%</span>
      <button class="icon-btn" id="zoomIn" title="放大">＋</button>
      <button class="btn ghost" id="btnShare" hidden
              title="把这篇论文（连同笔记/高亮/译文/AI 整理）共享给别的账号">🔗 共享</button>
      <button class="btn ghost" id="btnToc" title="目录：优先用 PDF 自带书签，没有就让 LLM 从全文提取">📑 目录</button>
      <button class="btn ghost" id="btnReparse"
              title="用这篇论文的原始 PDF 重新解析版式（解析器升级/换了 OCR 后端后用；笔记、高亮、译文、进度都保留）">🔄 重解析</button>
      <input type="file" id="reparseFile" accept="application/pdf,.pdf" hidden>
      <button class="btn primary" id="btnNotes">📝 笔记 <span id="notesCount">0</span></button>
    </div>
  </header>

  <div class="notice" id="notice" hidden></div>
  <div class="trans-progress" id="transProgress" hidden>
    <div class="bar"><i id="tpBar"></i></div>
    <span id="tpText">0 / 0</span>
    <button class="cancel" id="tpCancel">取消</button>
  </div>

  <main class="reader-main" id="readerMain">
    <div class="pages" id="pages"></div>

    <!-- 页码：点数字→输页号→回车跳转（Esc 取消） -->
    <div class="pageind" id="pageInd" title="输入页码后按回车跳转 （Esc 取消）">
      <input class="pagein" id="pageIn" type="text" inputmode="numeric" maxlength="4"
             autocomplete="off" aria-label="输入页码跳转" placeholder="-">
      <span class="psep">/</span>
      <b id="pageTotal">-</b>
    </div>
  </main>

  <!-- 文末 · AI 辅助阅读：左边聊思路，右边是笔记整理（读到 ≥95% 自动整理一次）。
       放在 .reader-main 之外：它不需要为右侧批注栏留白，否则整理框会被挤得很窄。 -->
  <section class="ai-end" id="aiEnd">
    <div class="ai-in">
      <div class="ai-head">
        <b><i class="ai-mark" aria-hidden="true"></i>AI 辅助阅读</b>
        <span class="ai-sub" id="aiSub"></span>
        <span class="grow"></span>
        <button class="btn ghost" id="aiRegen" type="button" title="按当前笔记重新整理一次">重新整理</button>
        <button class="btn ghost" id="aiClear" type="button" title="只清掉对话，整理结果保留">清空对话</button>
      </div>
      <div class="ai-body" id="aiBody">
        <div class="ai-chat" id="aiChat">
          <div class="ai-msgs" id="aiMsgs"></div>
          <div class="ai-send">
            <textarea id="aiText" rows="2" spellcheck="false"
                      placeholder="就这篇论文或你的笔记提问（Enter 发送，Shift+Enter 换行）"></textarea>
            <button class="btn primary" id="aiSend" type="button">发送</button>
          </div>
        </div>
        <div class="ai-sum" id="aiSum"></div>
      </div>
    </div>
  </section>

  <!-- 左侧目录：PDF 自带书签直接用；没有书签时可用 LLM 读全文提取 -->
  <aside class="toc-panel" id="tocPanel">
    <div class="sp-head">
      <b>📑 目录</b>
      <span class="cnt" id="tocCount"></span>
      <button class="sp-close" id="tocClose" title="收起">×</button>
    </div>
    <div class="toc-list" id="tocList"></div>

    <!-- 目录旁的独立一块：AI 辅助阅读（靠分隔线隔开，与目录内容不是一个整体） -->
    <div class="toc-ai" id="tocAi">
      <div class="toc-ai-head">
        <b><i class="ai-mark" aria-hidden="true"></i>AI 辅助阅读</b>
        <span class="cnt" id="tocAiState"></span>
      </div>
      <div class="toc-ai-list" id="tocAiList"></div>
      <button class="toc-ai-go" id="tocAiGo" type="button">去文末看整理 / 聊一聊 →</button>
    </div>

    <div class="toc-foot" id="tocFoot"></div>
  </aside>

  <!-- 右侧“全部笔记”总览（笔记正文内嵌在正文句下方，这里只做一览/定位） -->
  <aside class="side-panel" id="side">
    <div class="sp-head">
      <b>📝 全部笔记</b>
      <span class="cnt" id="spCount"></span>
      <button class="sp-close" id="closeSide" title="收起">×</button>
    </div>
    <div class="sp-list" id="spList"></div>
  </aside>

  <!-- 选中句子后的浮动工具条（不显示选中内容预览，只放操作按钮） -->
  <div class="fbar" id="fbar" hidden>
    <button data-a="trans" id="fbTrans">翻译</button>
    <span class="sep"></span>
    <button data-a="hl" id="fbHl">标注</button>
    <button data-a="note" id="fbNote">笔记</button>
    <button data-a="copy" id="fbCopy">复制</button>
    <span class="sep"></span>
    <button data-a="close" id="fbClose" style="color:#9fb0c8">✕</button>
    <div class="hmenu" id="hmenu">
      <!-- 6 个色块由 JS 按调色盘渲染（前 3 个默认，后 3 个可自定义） -->
      <div class="swatches"></div>
      <div class="swedit">
        <span class="lbl">自定义</span>
        <input type="color" title="自定义颜色 1">
        <input type="color" title="自定义颜色 2">
        <input type="color" title="自定义颜色 3">
      </div>
      <button data-a="hlclear">清除高亮</button>
    </div>
  </div>

  <div id="toast"></div>

itle", "unlimited": true, "label": "", "x": 131.58, "y": 414.216, "w": 123.624, "h": 11.88, "text": "1.3 Inline Formulas", "math": [], "html": "", "lines": [{"x": 131.58, "y": 414.216, "w": 123.624, "h": 11.88, "runs": [{"t": "1.3 Inline Formulas"}], "s": 11.82}], "align": "left", "level": 2, "size": 11.82, "line_h": 14.77}, {"id": "p2b23", "kind": "text", "utype": "text", "unlimited": true, "label": "", "x": 130.356, "y": 434.016, "w": 348.228, "h": 60.984, "text": "In mathematics, the quadratic equation ax^2 + bx + c = 0 can be solved using the formula x = \\frac{-b \\pm \\sqrt{b^2 - 4ac}}{2a}, where the discriminant \\Delta = b^2 - 4ac determines the nature of the roots. When \\Delta > 0, there are two distinct real roots; when \\Delta = 0, there is exactly one real root; and when \\Delta < 0, the roots are complex conjugates.", "math": [{"a": 39, "b": 56, "latex": "ax^2 + bx + c = 0"}, {"a": 89, "b": 127, "latex": "x = \\frac{-b \\pm \\sqrt{b^2 - 4ac}}{2a}"}, {"a": 152, "b": 170, "latex": "\\Delta = b^2 - 4ac"}, {"a": 212, "b": 222, "latex": "\\Delta > 0"}, {"a": 264, "b": 274, "latex": "\\Delta = 0"}, {"a": 317, "b": 327, "latex": "\\Delta < 0"}], "html": "", "lines": [{"x": 130.356, "y": 434.016, "w": 348.228, "h": 60.984, "runs": [{"t": "In mathematics, the quadratic equation ax^2 + bx + c = 0 can be solved using the formula x = \\frac{-b \\pm \\sqrt{b^2 - 4ac}}{2a}, where the discriminant \\Delta = b^2 - 4ac determines the nature of the roots. When \\Delta > 0, there are two distinct real roots; when \\Delta = 0, there is exactly one real root; and when \\Delta < 0, the roots are complex conjugates."}], "s": 9.69}], "align": "justify", "size": 9.69, "line_h": 13.76}, {"id": "p2b24", "kind": "text", "utype": "text", "unlimited": true, "label": "", "x": 130.356, "y": 495.0, "w": 349.452, "h": 66.528, "text": "For sequences, the arithmetic series \\sum_{i=1}^{n} a_i can be expressed as \\frac{n(a_1 + a_n)}{2}, while the geometric series \\sum_{k=0}^{\\infty} ar^k converges to \\frac{a}{1-r} when |r| < 1. In calculus, the derivative f'(x) = \\lim_{h \\to 0} \\frac{f(x+h) - f(x)}{h} represents the instantaneous rate of change, and the definite integral \\int_a^b f(x) dx gives the accumulated area under the curve.", "math": [{"a": 37, "b": 55, "latex": "\\sum_{i=1}^{n} a_i"}, {"a": 76, "b": 98, "latex": "\\frac{n(a_1 + a_n)}{2}"}, {"a": 127, "b": 151, "latex": "\\sum_{k=0}^{\\infty} ar^k"}, {"a": 165, "b": 178, "latex": "\\frac{a}{1-r}"}, {"a": 184, "b": 191, "latex": "|r| < 1"}, {"a": 221, "b": 267, "latex": "f'(x) = \\lim_{h \\to 0} \\frac{f(x+h) - f(x)}{h}"}, {"a": 339, "b": 355, "latex": "\\int_a^b f(x) dx"}], "html": "", "lines": [{"x": 130.356, "y": 495.0, "w": 349.452, "h": 66.528, "runs": [{"t": "For sequences, the arithmetic series \\sum_{i=1}^{n} a_i can be expressed as \\frac{n(a_1 + a_n)}{2}, while the geometric series \\sum_{k=0}^{\\infty} ar^k converges to \\frac{a}{1-r} when |r| < 1. In calculus, the derivative f'(x) = \\lim_{h \\to 0} \\frac{f(x+h) - f(x)}{h} represents the instantaneous rate of change, and the definite integral \\int_a^b f(x) dx gives the accumulated area under the curve."}], "s": 9.69}], "align": "justify", "size": 9.69, "line_h": 13.76}, {"id": "p2b25", "kind": "text", "utype": "text", "unlimited": true, "label": "", "x": 130.356, "y": 562.32, "w": 349.452, "h": 49.896, "text": "In probability theory, if X \\sim N(\\mu, \\sigma^2), then the expected value \\mathbb{E}[X] = \\mu and the variance \\operatorname{Var}(X) = \\sigma^2. The standard normal distribution has the density function \\phi(x) = \\frac{1}{\\sqrt{2\\pi}} e^{-x^2/2}, and its cumulative distribution function is denoted by \\Phi(x).", "math": [{"a": 26, "b": 49, "latex": "X \\sim N(\\mu, \\sigma^2)"}, {"a": 75, "b": 94, "latex": "\\mathbb{E}[X] = \\mu"}, {"a": 112, "b": 144, "latex": "\\operatorname{Var}(X) = \\sigma^2"}, {"a": 204, "b": 246, "latex": "\\phi(x) = \\frac{1}{\\sqrt{2\\pi}} e^{-x^2/2}"}, {"a": 303, "b": 310, "latex": "\\Phi(x)"}], "html": "", "lines": [{"x": 130.356, "y": 562.32, "w": 349.452, "h": 49.896, "runs": [{"t": "In probability theory, if X \\sim N(\\mu, \\sigma^2), then the expected value \\mathbb{E}[X] = \\mu and the variance \\operatorname{Var}(X) = \\sigma^2. The standard normal distribution has the density function \\phi(x) = \\frac{1}{\\sqrt{2\\pi}} e^{-x^2/2}, and its cumulative distribution function is denoted by \\Phi(x)."}], "s": 9.69}], "align": "justify", "size": 9.69, "line_h": 13.76}, {"id": "p2b26", "kind": "text", "utype": "text", "unlimited": true, "label": "", "x": 130.356, "y": 613.008, "w": 349.452, "h": 48.312, "text": "For vectors in \\mathbb{R}^n, the dot product \\mathbf{u} \\cdot \\mathbf{v} = \\sum_{i=1}^{n} u_i v_i measures the angle between vectors, while the norm \\| \\mathbf{v} \\|_2 = \\sqrt{\\sum_{i=1}^{n} v_i^2} gives the Euclidean length. A matrix A \\in \\mathbb{R}^{m \\times n} is orthogonal if A^T A = I_n, where I_n is the n \\times n identity matrix.", "math": [{"a": 15, "b": 27, "latex": "\\mathbb{R}^n"}, {"a": 45, "b": 97, "latex": "\\mathbf{u} \\cdot \\mathbf{v} = \\sum_{i=1}^{n} u_i v_i"}, {"a": 149, "b": 197, "latex": "\\| \\mathbf{v} \\|_2 = \\sqrt{\\sum_{i=1}^{n} v_i^2}"}, {"a": 235, "b": 264, "latex": "A \\in \\mathbb{R}^{m \\times n}"}, {"a": 282, "b": 293, "latex": "A^T A = I_n"}, {"a": 301, "b": 304, "latex": "I_n"}, {"a": 312, "b": 322, "latex": "n \\times n"}], "html": "", "lines": [{"x": 130.356, "y": 613.008, "w": 349.452, "h": 48.312, "runs": [{"t": "For vectors in \\mathbb{R}^n, the dot product \\mathbf{u} \\cdot \\mathbf{v} = \\sum_{i=1}^{n} u_i v_i measures the angle between vectors, while the norm \\| \\mathbf{v} \\|_2 = \\sqrt{\\sum_{i=1}^{n} v_i^2} gives the Euclidean length. A matrix A \\in \\mathbb{R}^{m \\times n} is orthogonal if A^T A = I_n, where I_n is the n \\times n identity matrix."}], "s": 9.69}], "align": "justify", "size": 9.69, "line_h": 13.76}, {"id": "p2b27", "kind": "text", "utype": "text", "unlimited": true, "label": "", "x": 145.656, "y": 662.904, "w": 333.54, "h": 13.464, "text": "In information theory, the entropy  H(X) = -\\sum_{i} p(x_{i}) \\log p(x_{i})  quantifies", "math": [{"a": 36, "b": 75, "latex": "H(X) = -\\sum_{i} p(x_{i}) \\log p(x_{i})"}], "html": "", "lines": [{"x": 145.656, "y": 662.904, "w": 333.54, "h": 13.464, "runs": [{"t": "In information theory, the entropy  H(X) = -\\sum_{i} p(x_{i}) \\log p(x_{i})  quantifies"}], "s": 9.69}], "align": "justify", "size": 9.69, "line_h": 13.76}, {"id": "p2b28", "kind": "footer", "utype": "page_number", "unlimited": true, "label": "", "x": 301.716, "y": 694.584, "w": 7.344, "h": 9.504, "text": "2", "math": [], "html": "", "lines": [{"x": 301.716, "y": 694.584, "w": 7.344, "h": 9.504, "runs": [{"t": "2"}], "s": 8.53}], "align": "left", "size": 8.53, "line_h": 11.25}], "images": [], "text": "Summation formula:\n\nIntegral formula:\n\nLimit formula:\n\nAligned multi-line formula:\n\nComplex summation:\n\nMultiple integral:\n\nLimit and fraction:\n\nMatrix:\n\nPiecewise function:\n\nMulti-line formula:\n\n1.3 Inline Formulas\n\nIn mathematics, the quadratic equation ax^2 + bx + c = 0 can be solved using the formula x = \\frac{-b \\pm \\sqrt{b^2 - 4ac}}{2a}, where the discriminant \\Delta = b^2 - 4ac determines the nature of the roots. When \\Delta > 0, there are two distinct real roots; when \\Delta = 0, there is exactly one real root; and when \\Delta < 0, the roots are complex conjugates.\n\nFor sequences, the arithmetic series \\sum_{i=1}^{n} a_i can be expressed as \\frac{n(a_1 + a_n)}{2}, while the geometric series \\sum_{k=0}^{\\infty} ar^k converges to \\frac{a}{1-r} when |r| < 1. In calculus, the derivative f'(x) = \\lim_{h \\to 0} \\frac{f(x+h) - f(x)}{h} represents the instantaneous rate of change, and the definite integral \\int_a^b f(x) dx gives the accumulated area under the curve.\n\nIn probability theory, if X \\sim N(\\mu, \\sigma^2), then the expected value \\mathbb{E}[X] = \\mu and the variance \\operatorname{Var}(X) = \\sigma^2. The standard normal distribution has the density function \\phi(x) = \\frac{1}{\\sqrt{2\\pi}} e^{-x^2/2}, and its cumulative distribution function is denoted by \\Phi(x).\n\nFor vectors in \\mathbb{R}^n, the dot product \\mathbf{u} \\cdot \\mathbf{v} = \\sum_{i=1}^{n} u_i v_i measures the angle between vectors, while the norm \\| \\mathbf{v} \\|_2 = \\sqrt{\\sum_{i=1}^{n} v_i^2} gives the Euclidean length. A matrix A \\in \\mathbb{R}^{m \\times n} is orthogonal if A^T A = I_n, where I_n is the n \\times n identity matrix.\n\nIn information theory, the entropy  H(X) = -\\sum_{i} p(x_{i}) \\log p(x_{i})  quantifies\n\n2"}, {"w": 612.0, "h": 792.0, "texts": [{"id": "p3b0", "kind": "text", "utype": "text", "unlimited": true, "label": "", "x": 130.356, "y": 124.344, "w": 348.228, "h": 26.136, "text": "uncertainty, and the KL divergence  D_{\\mathrm{KL}}(P\\|Q)=\\sum_{i}p(x_{i})\\log\\frac{p(x_{i})}{q(x_{i})}  measures the difference between two probability distributions P and Q.", "math": [{"a": 36, "b": 103, "latex": "D_{\\mathrm{KL}}(P\\|Q)=\\sum_{i}p(x_{i})\\log\\frac{p(x_{i})}{q(x_{i})}"}], "html": "", "lines": [{"x": 130.356, "y": 124.344, "w": 348.228, "h": 26.136, "runs": [{"t": "uncertainty, and the KL divergence  D_{\\mathrm{KL}}(P\\|Q)=\\sum_{i}p(x_{i})\\log\\frac{p(x_{i})}{q(x_{i})}  measures the difference between two probability distributions P and Q."}], "s": 9.69}], "align": "justify", "size": 9.69, "line_h": 13.76}, {"id": "p3b1", "kind": "text", "utype": "text", "unlimited": true, "label": "", "x": 130.356, "y": 162.36, "w": 169.726, "h": 108.504, "text": "In mathematics, the quadratic equation ax^2 + bx + c = 0 can be solved using the formula x = \\frac{-b \\pm \\sqrt{b^2 - 4ac}}{2}, where the discriminant \\Delta = b^2 - 4ac determines the nature of the roots. When \\Delta > 0, there are two distinct real roots; when \\Delta = 0, there is exactly one real root; and when \\Delta < 0, the roots are com
