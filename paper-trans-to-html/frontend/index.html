<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>论文阅读器 · PDF 转 HTML</title>
  <link rel="stylesheet" href="css/style.css">
  <!-- 首屏先把主题套上：等 CSS/JS 加载完再切会闪一下白 -->
  <script>try{if(localStorage.getItem("paperReader.theme")==="dark")document.documentElement.classList.add("dark");}catch(e){}</script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="./"><span class="logo">◆</span> 论文阅读器</a>
    <span style="color:var(--mut);font-size:13px">PDF 转 HTML · 翻译 / 标注 / 笔记</span>
  </header>

  <main class="container">
    <h1 class="page-title">上传论文</h1>
    <p class="page-sub">支持英文学术 PDF。转换后版式与原文一致，可对任意段落进行“整段翻译 / 高亮标注 / 笔记”。</p>

    <div class="upload-card" id="drop">
      <div class="big">📄</div>
      <h3>点击选择 或 拖拽 PDF 到此处</h3>
      <p>转换期间请勿关闭页面</p>
      <input type="file" id="file" accept=".pdf,application/pdf" hidden>
    </div>

    <section class="section">
      <div class="section-head">
        <h2>论文阅读记录</h2>
        <div class="stats" id="stats"></div>
        <div class="seg" id="filterSeg">
          <button data-f="all" class="on">全部</button>
          <button data-f="unread">未读</button>
          <button data-f="reading">在读</button>
          <button data-f="done">读完</button>
        </div>
      </div>
      <div class="cards" id="cards"></div>
      <div class="empty" id="empty" hidden>暂无论文，先上传一篇吧 📥</div>
    </section>

    <!-- 别人共享给我的（只读 / 可写）；没有就不显示这块 -->
    <section class="section" id="sharedWrap" hidden>
      <div class="section-head">
        <h2>共享给我的</h2>
        <span class="page-sub" style="margin:0">别人把论文（连同笔记）共享给了你</span>
      </div>
      <div class="cards" id="sharedCards"></div>
    </section>
  </main>

  <div class="overlay" id="overlay">
    <div class="overlay-card">
      <div class="spinner"></div>
      <div id="ovText">正在解析并转换 PDF…</div>
    </div>
  </div>

  <div id="toast"></div>
  <script src="js/common.js"></script>
  <script src="js/home.js"></script>
</body>
</html>
